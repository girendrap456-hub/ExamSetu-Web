const SUPABASE_URL='https://ntdxnrckeyiokfvrhwox.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_LsJYKxEP7RqexxQVyVEi8w_8Gj4NRR7';
const sb=window.supabase?.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
let demoAccount=null,loggedIn=false,authError='',loginEmail='',currentUser=null;
async function initOnlineAuth(){
 if(!sb){authError='Supabase SDK लोड नहीं हुआ। इंटरनेट जाँचें।';render();return}
 try{const {data:{session},error}=await sb.auth.getSession();if(error)throw error;
  if(session?.user){await applyOnlineUser(session.user);page='home'}else page='login';
  sb.auth.onAuthStateChange((_event,session)=>{if(!session?.user){currentUser=null;loggedIn=false;admin=false;if(page!=='signup'&&page!=='forgot')page='login';render()}});
 }catch(e){authError=e.message||'Login connection failed';page='login'}render();
}
async function applyOnlineUser(user){currentUser=user;loggedIn=true;loginEmail=user.email||'';
 let name=user.user_metadata?.full_name||user.email?.split('@')[0]||'Student';
 const {data:profile,error}=await sb.from('profiles').select('full_name,role').eq('id',user.id).maybeSingle();
 if(!error&&profile?.full_name)name=profile.full_name;
 demoAccount={name,email:user.email,id:user.id};
 await loadOnlineExams();
 // Role is checked again on admin entry. Never infer admin from a client-stored flag.
}
async function registerDemo(){
 const name=document.getElementById('signupName')?.value.trim()||'';
 const email=document.getElementById('signupEmail')?.value.trim().toLowerCase()||'';
 const pw=document.getElementById('signupPassword')?.value||'';
 const confirm=document.getElementById('signupConfirm')?.value||'';
 if(!name||!/^\S+@\S+\.\S+$/.test(email)||pw.length<8||pw!==confirm){authError='नाम, सही Email और समान Password (कम से कम 8 अक्षर) डालें।';render();return}
 if(!sb){authError='Internet / Supabase SDK उपलब्ध नहीं है';render();return}
 try{const {data,error}=await sb.auth.signUp({email,password:pw,options:{data:{full_name:name}}});if(error)throw error;
  authError='Signup request भेजी गई। यदि नया Account है तो Email में Confirmation Link खोलें, फिर Login करें।';loginEmail=email;page='login';render();
 }catch(e){authError=e.message||'Signup failed';render()}
}
async function loginDemo(){
 const email=document.getElementById('loginEmail')?.value.trim().toLowerCase()||'';
 const pw=document.getElementById('loginPassword')?.value||'';
 if(!sb){authError='Internet / Supabase SDK उपलब्ध नहीं है';render();return}
 try{const {data,error}=await sb.auth.signInWithPassword({email,password:pw});if(error)throw error;

 }catch(e){authError=e.message||'Login failed';render()}
}

 loggedIn=false;currentUser=null;admin=false;authError='';go('login')}

 if(!sb||!currentUser){authError='पहले Login करें';go('login');return}

 admin=true;go('admin');
}

let onlineExams=[],onlineExamQuestions=[],onlineSelectedExam=null,onlineLoadState='loading',onlineQuestionState='';
async function loadOnlineExams(){
 if(!sb||!currentUser)return;
 onlineLoadState='loading';
 try{
  const {data,error}=await sb.from('exams').select('id,title,category,description,duration_minutes,negative_mark,created_at').eq('is_published',true).order('created_at',{ascending:false}).limit(200);
  if(error)throw error;

// Folder-based JSON exam importer (Supabase online save; local editor remains legacy)
const STORE_FOLDERS='examsetu_demo_folders_v2', STORE_EXAMS='examsetu_demo_imported_v2';
let folders=[], importedExams=[], chosenFolder='', importedPreview=null, importError='', adminSelectedType='Full Mock', adminPYQYear='';
try{folders=JSON.parse(localStorage.getItem(STORE_FOLDERS)||'null')||[]}catch(e){}
try{importedExams=JSON.parse(localStorage.getItem(STORE_EXAMS)||'[]')}catch(e){}
if(!folders.length){folders=[{id:'up',name:'UP Exams',parent:null},{id:'upsssc',name:'UPSSSC',parent:'up'},{id:'pet',name:'PET',parent:'upsssc'},{id:'police',name:'UP Police',parent:'up'},{id:'supertet',name:'Super TET',parent:'up'},{id:'primary',name:'Primary Teacher',parent:'up'},{id:'ssc',name:'SSC GD',parent:null},{id:'railway',name:'Railway Group D',parent:null}];}
function saveLibrary(){try{localStorage.setItem(STORE_FOLDERS,JSON.stringify(folders));localStorage.setItem(STORE_EXAMS,JSON.stringify(importedExams))}catch(e){alert('Storage full: छोटे JSON से कोशिश करें।')}}
function folderPath(id){let parts=[],seen=new Set();while(id&&!seen.has(id)){seen.add(id);let f=folders.find(x=>x.id===id);if(!f)break;parts.unshift(f.name);id=f.parent}return parts.join(' / ')}
function folderOptions(selected='',rootOption=true){return (rootOption?'<option value="">— Folder चुनें —</option>':'')+folders.map(f=>`<option value="${esc(f.id)}" ${selected===f.id?'selected':''}>${esc(folderPath(f.id))}</option>`).join('')}
function createFolder(){const name=prompt('नए Folder / Subfolder का नाम लिखें');if(!name||!name.trim())return;let parent=chosenFolder||null;let clean=name.trim();if(folders.some(f=>f.parent===parent&&f.name.toLowerCase()===clean.toLowerCase())){alert('इस जगह इसी नाम का Folder पहले से है');return}let id='folder_'+Date.now();folders.push({id,name:clean,parent});chosenFolder=id;saveLibrary();render()}
function folderTree(parent=null,depth=0){return folders.filter(f=>f.parent===parent).map(f=>`<div style="margin-left:${depth*15}px;padding:7px 0"><button class="btn alt" style="padding:6px 10px" onclick="chosenFolder='${esc(f.id)}';render()">📁 ${esc(f.name)} ${chosenFolder===f.id?'✓':''}</button> <span class="tiny muted">${importedExams.filter(x=>x.folderId===f.id).length} Exams</span></div>`+folderTree(f.id,depth+1)).join('')}
function validateExamJSON(raw){const obj=Array.isArray(raw)?{title:exam,questions:raw}:raw;if(!obj||typeof obj!=='object'||!Array.isArray(obj.questions)||!obj.questions.length)throw Error('JSON में questions की सूची आवश्यक है।');const title=String(obj.title||exam||'').trim();if(!title)throw Error('Exam Title आवश्यक है।');const minutes=Number(obj.minutes??obj.duration_minutes??70);if(!Number.isFinite(minutes)||minutes<1)throw Error('minutes कम से कम 1 होना चाहिए।');const defaultMarks=Number(obj.marks_per_question??obj.marks??3);if(!Number.isFinite(defaultMarks)||defaultMarks<=0)throw Error('प्रति प्रश्न अंक 0 से अधिक होने चाहिए।');const neg=Number(obj.negative_mark??0);if(!Number.isFinite(neg)||neg<0)throw Error('Negative Marking 0 या उससे अधिक होनी चाहिए।');const questions=obj.questions.map((q,i)=>{const text=String(q.text??q.question_text??q.question??'').trim();const options=q.options;const answer=Number(q.correct??q.answer??q.correct_index);if(!text)throw Error(`प्रश्न ${i+1}: Text आवश्यक है।`);if(!Array.isArray(options)||options.length!==4||options.some(x=>!String(x).trim()))throw Error(`प्रश्न ${i+1}: चार विकल्प आवश्यक हैं।`);if(!Number.isInteger(answer)||answer<0||answer>3)throw Error(`प्रश्न ${i+1}: correct/answer 0 से 3 होना चाहिए।`);const marks=Number(q.marks??defaultMarks);if(!Number.isFinite(marks)||marks<=0)throw Error(`प्रश्न ${i+1}: Marks सही डालें।`);return {text,text_en:String(q.text_en??q.en??''),options,options_en:Array.isArray(q.options_en)&&q.options_en.length===4?q.options_en:null,answer,marks,solution:String(q.solution??q.explanation??''),solution_en:String(q.solution_en??''),subject:String(q.subject??'General')}});return {title,minutes,questions,type:String(obj.type||'Full Mock'),marks_per_question:defaultMarks,negative_mark:neg,folderId:chosenFolder};}
async function selectExamFile(input){let file=input.files?.[0];if(!file)return;importError='';importedPreview=null;try{if(file.size>5*1024*1024)throw Error('Demo में 5 MB तक की JSON फाइल चुनें।');let raw=JSON.parse(await file.text());importedPreview=validateExamJSON(raw);if(!chosenFolder)throw Error('पहले Folder चुनें।');exam=importedPreview.title;}catch(e){importError=e.message}render()}
async function importExamNow(){
 if(!importedPreview){alert('पहले सही JSON फाइल चुनें।');return}
 if(!chosenFolder){alert('Folder चुनें।');return}
 if(!sb||!currentUser){alert('Supabase Login आवश्यक है।');return}
 const marks=Number(document.getElementById('adminMarks')?.value??importedPreview.marks_per_question??3);
 const negativeEnabled=!!document.getElementById('adminNegEnabled')?.checked;
 const neg=negativeEnabled?Number(document.getElementById('adminNegative')?.value??0):0;
 const cutoff=Number(document.getElementById('adminCutoff')?.value??0);
 if(!Number.isFinite(marks)||marks<=0||!Number.isFinite(neg)||neg<0||!Number.isFinite(cutoff)||cutoff<0||cutoff>marks*importedPreview.questions.length){alert('Marks, Negative Marking या Cutoff सही करें।');return}
 const btn=document.activeElement;if(btn?.tagName==='BUTTON')btn.disabled=true;
 let newId=null;
 try{
  const {data:profile,error:roleError}=await sb.from('profiles').select('role').eq('id',currentUser.id).single();
  if(roleError||profile?.role!=='admin')throw Error('केवल Supabase Admin Exam जोड़ सकता है।');
  const category=folderPath(chosenFolder)||'General';
  const {data:created,error:createError}=await sb.from('exams').insert({title:importedPreview.title,category,description:importedPreview.type||'Full Mock',duration_minutes:importedPreview.minutes,negative_mark:neg,is_published:false}).select('id').single();
  if(createError)throw createError;
  newId=created.id;
  const rows=importedPreview.questions.map((q,i)=>({exam_id:newId,question_text:q.text,options:q.options,answer:q.answer,marks:Number(q.marks||marks),question_order:i+1,solution:q.solution||''}));
  for(let i=0;i<rows.length;i+=100){const {error}=await sb.from('questions').insert(rows.slice(i,i+100));if(error)throw error}
  if(settings.publish){const {error}=await sb.from('exams').update({is_published:true}).eq('id',newId);if(error)throw error}
  importedPreview=null;importError='';
  alert('Exam Supabase में Online Save हो गया। अब दूसरे Browser में भी दिखाई दे सकता है।');
  await loadOnlineExams();render();
 }catch(e){
  if(newId){const {error:deleteError}=await sb.from('exams').delete().eq('id',newId);if(deleteError)alert('ध्यान दें: अधूरा Unpublished Exam Supabase में रह सकता है। Admin को इसे हटाना होगा।')}
  alert('Online Save FAILED: '+(e.message||String(e))+'\nBrowser Demo Storage में Exam Save नहीं किया गया।');
 }finally{if(btn?.tagName==='BUTTON')btn.disabled=false}
}
let editingExamId=null;
function editImportedExam(id){const x=importedExams.find(y=>y.id===id);if(!x)return;editingExamId=id;chosenFolder=x.folderId;go('import')}
function cancelExamEdit(){editingExamId=null;render()}
function saveExamEdit(){
 const x=importedExams.find(y=>y.id===editingExamId);if(!x)return;
 const title=document.getElementById('editExamTitle')?.value.trim();
 const minutes=Number(document.getElementById('editExamMinutes')?.value);
 const marks=Number(document.getElementById('editExamMarks')?.value);
 const negative= document.getElementById('editExamNegativeEnabled')?.checked ? Number(document.getElementById('editExamNegative')?.value) : 0;
 const cutoff=Number(document.getElementById('editExamCutoff')?.value);
 const folderId=document.getElementById('editExamFolder')?.value;
 const type=document.getElementById('editExamType')?.value||'Full Mock';const pyq_year=type==='PYQ'?String(document.getElementById('editPYQYear')?.value||'').trim():'';
 const published=!!document.getElementById('editExamPublished')?.checked;
 if(!title||!folderId||!Number.isFinite(minutes)||minutes<1||!Number.isFinite(marks)||marks<=0||!Number.isFinite(negative)||negative<0||!Number.isFinite(cutoff)||cutoff<0||cutoff>marks*x.questions.length){alert('Exam की Settings सही भरें।');return}
 if(importedExams.some(y=>y.id!==x.id&&y.folderId===folderId&&y.title.toLowerCase()===title.toLowerCase())){alert('इस Folder में इसी नाम का Exam पहले से है।');return}
 const oldTitle=x.title;
 Object.assign(x,{title,minutes,marks_per_question:marks,negative_mark:negative,folderId,type,pyq_year,published,questions:x.questions.map(q=>({...q,marks}))});
 if(oldTitle!==title){delete examCutoffs[oldTitle]}
 examCutoffs[title]=cutoff;
 localStorage.setItem('examsetu_demo_cutoffs',JSON.stringify(examCutoffs));saveLibrary();editingExamId=null;alert('Exam Update हो गया।');render();
}
function deleteImportedExam(id){const x=importedExams.find(y=>y.id===id);if(!x)return;if(!confirm('क्या आप "'+x.title+'" को Delete करना चाहते हैं? यह Exam इस Browser के Demo Storage से हट जाएगा।'))return;
 importedExams=importedExams.filter(y=>y.id!==id);if(editingExamId===id)editingExamId=null;
 if(!importedExams.some(y=>y.title===x.title)){delete examCutoffs[x.title];localStorage.setItem('examsetu_demo_cutoffs',JSON.stringify(examCutoffs))}
 saveLibrary();render();
}
function examEditPanel(){const x=importedExams.find(y=>y.id===editingExamId);if(!x)return '';
 const cutoff=Number(examCutoffs[x.title]??0);
 return `<div class="card admin-edit"><h2>✏️ Edit Exam — ${esc(x.title)}</h2>
 <label class="field">Exam Name<input id="editExamTitle" value="${esc(x.title)}"></label>
 <label class="field">Folder / Subfolder<select id="editExamFolder">${folderOptions(x.folderId,false)}</select></label>
 <label class="field">Test Type<select id="editExamType">${['Full Mock','Mock Test','Subject Test','Chapter Test','PYQ'].map(t=>`<option ${x.type===t?'selected':''}>${t}</option>`).join('')}</select></label>
 <label class="field">PYQ Exam Year (केवल PYQ के लिए)<input id="editPYQYear" type="number" min="1950" max="2100" placeholder="जैसे 2023" value="${esc(x.pyq_year||'')}"></label>
  <label class="field">Duration (Minutes)<input id="editExamMinutes" type="number" min="1" value="${x.minutes}"></label>
 <label class="field">Marks per Question<input id="editExamMarks" type="number" min="0.01" step="0.01" value="${x.marks_per_question||3}"></label>
 <label class="field"><input id="editExamNegativeEnabled" type="checkbox" ${x.negative_mark>0?'checked':''} onchange="document.getElementById('editExamNegative').disabled=!this.checked"> Negative Marking</label>
 <label class="field">Wrong Answer Deduction<input id="editExamNegative" type="number" min="0" step="0.01" value="${x.negative_mark||0}" ${x.negative_mark>0?'':'disabled'}></label>
 <label class="field">Cutoff Marks<input id="editExamCutoff" type="number" min="0" step="0.01" value="${cutoff}"></label>
 <label class="field"><input id="editExamPublished" type="checkbox" ${x.published?'checked':''}> Published (Students को दिखाएँ)</label>
 <p class="muted">${x.questions.length} Questions — Questions बदलने के लिए नीचे Replace JSON विकल्प इस्तेमाल करें।</p>
 <label class="field">Replace Questions JSON (optional)<input id="replaceExamJSON" type="file" accept=".json,application/json" onchange="replaceExamQuestions(this)"></label>
 <div class="flex"><button class="btn" onclick="saveExamEdit()">💾 Save Changes</button><button class="btn alt" onclick="cancelExamEdit()">Cancel</button><button class="btn alt" onclick="deleteImportedExam('${esc(x.id)}')">🗑 Delete Exam</button></div></div>`;
}
async function replaceExamQuestions(input){const x=importedExams.find(y=>y.id===editingExamId);const f=input.files?.[0];if(!x||!f)return;try{if(f.size>5*1024*1024)throw Error('5MB से छोटी JSON चुनें');const raw=JSON.parse(await f.text());const validated=validateExamJSON({...raw,title:x.title});if(!confirm(validated.questions.length+' नए प्रश्न पुराने प्रश्नों की जगह रख दें?'))return;x.questions=validated.questions.map(q=>({...q,marks:x.marks_per_question||3}));saveLibrary();alert('Questions Replace हो गए। Save Changes से बाकी Settings अपडेट करें।')}catch(e){alert('JSON Error: '+e.message)}}
function libraryManager(){return `<div class="card"><h2>📁 Exam Folder Manager</h2><p class="muted">Folder या Subfolder चुनें। नया Folder चुने हुए Folder के अंदर बनेगा। Root Folder के लिए चयन हटाएँ।</p><label class="field">Exam कहाँ जोड़ना है?<select id="folderSelect" onchange="chosenFolder=this.value;render()">${folderOptions(chosenFolder)}</select></label><div class="flex"><button class="btn alt" onclick="createFolder()">+ New Folder / Subfolder</button><button class="btn alt" onclick="chosenFolder='';render()">Root चुनें</button></div><div style="margin-top:12px;border-top:1px solid #e1e8f0;padding-top:10px">${folderTree()}</div></div>`}
function selectAdminPaperType(type){adminSelectedType=type;importError='';render()}
function adminPaperTypeCards(){const types=[['Full Mock','Add Full Mock','पूरी परीक्षा का पेपर'],['Mock Test','Add Mock Test','अभ्यास मॉक टेस्ट'],['PYQ','Add PYQ + Year','पिछले वर्षों के प्रश्नपत्र'],['Subject Test','Add Subject Test','विषय के अनुसार टेस्ट'],['Chapter Test','Add Chapter Test','अध्याय के अनुसार टेस्ट']];return `<div class="card admin-test-types"><h2>📚 Student के अनुसार Exam Type चुनें</h2><p class="muted">नीचे किसी एक विकल्प पर क्लिक करें, फिर Folder और JSON से पेपर जोड़ें।</p><div class="admin-type-grid">${types.map(([type,label,desc])=>`<button type="button" class="admin-type-choice ${adminSelectedType===type?'selected':''}" onclick="selectAdminPaperType('${type}')"><b>${label}</b><small>${desc}</small>${adminSelectedType===type?'<span class="type-selected">✓ Selected</span>':''}</button>`).join('')}</div>${adminSelectedType==='PYQ'?`<label class="field"><b>PYQ Year (वर्ष)</b><input id="adminPYQYear" type="number" min="1950" max="2100" placeholder="जैसे 2024" value="${esc(adminPYQYear)}" oninput="adminPYQYear=this.value"></label>`:''}<p class="muted">चुना गया प्रकार: <b>${esc(adminSelectedType)}</b></p></div>`}
function adminPaperTypeOptions(selected){return [['Full Mock','Full Mock'],['Mock Test','Mock Test'],['Subject Test','Subject Test'],['Chapter Test','Chapter Test'],['PYQ','PYQ — Previous Year Questions']].map(([v,label])=>`<option value="${v}" ${selected===v?'selected':''}>${label}</option>`).join('')}
function importManager(){return `${adminPaperTypeCards()}${libraryManager()}${examEditPanel()}<div class="card"><h2>📥 ${esc(adminSelectedType)} — JSON Upload</h2><p class="muted">ऊपर चुने गए प्रकार का पेपर यहाँ Import करें।</p><label class="field"><b>2. Select JSON File</b><input type="file" accept=".json,application/json" onchange="selectExamFile(this)"></label>${importError?`<p class="danger">⚠ ${esc(importError)}</p>`:''}${importedPreview?`<div class="stat"><b>${esc(importedPreview.title)}</b><p>${importedPreview.questions.length} Questions • ${importedPreview.minutes} Minutes</p><p>📁 ${esc(folderPath(chosenFolder))}</p></div><div class="marks-settings"><label class="field">एक Question के Marks<input id="adminMarks" type="number" min="0.01" step="0.01" value="${importedPreview.marks_per_question||3}"></label><label class="field"><input id="adminNegEnabled" type="checkbox" ${importedPreview.negative_mark>0?'checked':''} onchange="document.getElementById('adminNegative').disabled=!this.checked"> Negative Marking लागू करें</label><label class="field">एक गलत उत्तर पर कितने Marks कटेंगे?<input id="adminNegative" type="number" min="0" step="0.01" value="${importedPreview.negative_mark||0}" ${importedPreview.negative_mark>0?'':'disabled'}></label><label class="field">Cutoff Marks<input id="adminCutoff" type="number" min="0" step="0.01" value="0"></label></div><br><button class="btn" onclick="importExamNow()">✓ Add ${adminSelectedType==='PYQ'?'PYQ':'Exam'} to Folder</button>`:'<p class="muted">Folder चुनें और JSON File Upload करें। फिर Marks, Cutoff और Add Button दिखाई देंगे।</p>'}</div><div class="card"><h2>Imported Exams (${importedExams.length})</h2>${importedExams.map(x=>`<p>📄 <b>${esc(x.title)}</b> • ${x.questions.length} Questions • ${esc(x.type||'Full Mock')} ${x.pyq_year?'('+esc(x.pyq_year)+')':''} • ${x.marks_per_question||3} Marks/Question • Negative ${x.negative_mark||0}<br><small>📁 ${esc(folderPath(x.folderId))} · ${x.published?'🟢 Published':'⚪ Draft'}</small><br><button class="btn alt" onclick="editImportedExam('${esc(x.id)}')">✏️ Edit</button> <button class="btn alt" onclick="deleteImportedExam('${esc(x.id)}')">🗑 Delete</button></p>`).join('')||'<p class="muted">अभी कोई Exam Import नहीं किया गया।</p>'}</div>`}

function filterSeries(term){window.examSearchTerm=String(term||'').toLowerCase();document.querySelectorAll('.series-card').forEach(el=>el.style.display=el.textContent.toLowerCase().includes(window.examSearchTerm)?'':'none')}
function libraryStudentList(){const items=importedExams.filter(x=>x.published);return `<h2>Imported Exams</h2>${items.length?items.map(x=>examCard(x.title,true)).join(''):'<p class="muted">अभी कोई Published Imported Exam नहीं है।</p>'}`}
function copySettings(){let txt=JSON.stringify({title:exam,...settings},null,2);if(navigator.clipboard)navigator.clipboard.writeText(txt).then(()=>alert('Settings copied')).catch(()=>alert(txt));else alert(txt)}
window.addEventListener('popstate',()=>back());render();initOnlineAuth();
</script><script>
function toggleTopMore(){const el=document.getElementById('top-more-menu');if(el)el.hidden=!el.hidden}
function searchTopExams(term){window.examSearchTerm=String(term||'').trim().toLowerCase();if(typeof go==='function')go('tests');filterTopExamCards()}
function filterTopExamCards(){const term=window.examSearchTerm||'';document.querySelectorAll('.exam-list-card').forEach(el=>{el.style.display=el.textContent.toLowerCase().includes(term)?'':'none'})}
</script><script>
/* Question-by-question editing for imported exams; stored in the existing local demo library. */
(function(){
 const original=window.examEditPanel;
 if(typeof original!=='function')return;
 window.examEditPanel=function(){
  let html=original();
  const x=importedExams.find(y=>y.id===editingExamId);
  if(!x)return html;
  return html+`<div class="card admin-question-editor"><h2>📝 प्रश्न और उत्तर Edit करें</h2><p class="muted">प्रश्न, चार विकल्प, सही उत्तर, समाधान और English Translation बदल सकते हैं। बदलाव के बाद Save Question दबाएँ।</p><label class="field">Question चुनें<select id="questionEditIndex" onchange="showAdminQuestionEditor()">${x.questions.map((q,i)=>`<option value="${i}">Q${i+1}. ${esc(String(q.text||q.question_text||'').slice(0,65))}</option>`).join('')}</select></label><div id="questionEditFields"></div><div class="question-edit-actions"><button class="btn" onclick="saveAdminQuestion()">💾 Save Question</button><button class="btn alt" onclick="addAdminQuestion()">+ Add Question</button><button class="btn alt" onclick="deleteAdminQuestion()">🗑 Delete Question</button></div></div>`;
 };
 window.showAdminQuestionEditor=function(){
  const x=importedExams.find(y=>y.id===editingExamId), el=document.getElementById('questionEditFields');if(!x||!el)return;
  const i=Number(document.getElementById('questionEditIndex').value),q=x.questions[i];if(!q)return;
  const safe=v=>esc(String(v??''));
  el.innerHTML=`<label class="field">Question (Hindi)<textarea id="qEditText">${safe(q.text||q.question_text)}</textarea></label>`+
  (q.options||['','','','']).map((v,j)=>`<label class="field">Option ${'ABCD'[j]}<input id="qEditOpt${j}" value="${safe(v)}"></label>`).join('')+
  `<label class="field">Correct Answer<select id="qEditCorrect">${[0,1,2,3].map(j=>`<option value="${j}" ${Number(q.correct??q.answer)===j?'selected':''}>${'ABCD'[j]}</option>`).join('')}</select></label>`+
  `<label class="field">Detailed Solution<textarea id="qEditSolution">${safe(q.solution||q.explanation)}</textarea></label>`+
  `<label class="field">Question (English, optional)<textarea id="qEditEnglish">${safe(q.text_en)}</textarea></label>`+
  (q.options_en||['','','','']).map((v,j)=>`<label class="field">English Option ${'ABCD'[j]}<input id="qEditEnOpt${j}" value="${safe(v)}"></label>`).join('');
 };
 window.saveAdminQuestion=function(){
  const x=importedExams.find(y=>y.id===editingExamId);if(!x)return;
  const i=Number(document.getElementById('questionEditIndex')?.value),q=x.questions[i];if(!q)return;
  const text=document.getElementById('qEditText').value.trim(),options=[0,1,2,3].map(j=>document.getElementById('qEditOpt'+j).value.trim());
  if(!text||options.some(v=>!v)){alert('Question और चारों Options भरें।');return}
  const correct=Number(document.getElementById('qEditCorrect').value),solution=document.getElementById('qEditSolution').value.trim(),text_en=document.getElementById('qEditEnglish').value.trim(),options_en=[0,1,2,3].map(j=>document.getElementById('qEditEnOpt'+j).value.trim());
  Object.assign(q,{text,question_text:text,options,correct,answer:correct,solution,explanation:solution,text_en,options_en:options_en.every(Boolean)?options_en:[]});
  saveLibrary();alert('Question Save हो गया।');render();
 };
 window.addAdminQuestion=function(){
  const x=importedExams.find(y=>y.id===editingExamId);if(!x)return;
  x.questions.push({text:'नया प्रश्न',options:['विकल्प A','विकल्प B','विकल्प C','विकल्प D'],correct:0,answer:0,solution:'',marks:x.marks_per_question||3});saveLibrary();render();
  const sel=document.getElementById('questionEditIndex');if(sel){sel.value=String(x.questions.length-1);showAdminQuestionEditor()}
 };
 window.deleteAdminQuestion=function(){
  const x=importedExams.find(y=>y.id===editingExamId);if(!x)return;if(x.questions.length<=1){alert('कम से कम एक Question रहना चाहिए।');return}
  const i=Number(document.getElementById('questionEditIndex')?.value);if(!confirm('Question '+(i+1)+' Delete करें?'))return;
  x.questions.splice(i,1);saveLibrary();render();
 };
 const originalRender=window.render;
 if(typeof originalRender==='function')window.render=function(){const r=originalRender.apply(this,arguments);if(editingExamId&&document.getElementById('questionEditFields'))showAdminQuestionEditor();return r};
})();

initOnlineAuth();
</script></body></html>
