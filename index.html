/* ExamSetu mobile refinement: presentation only; existing application logic retained. */
@media (max-width:700px){
 html,body,.app{width:100%;max-width:100%;overflow-x:hidden}
 header{padding:8px 10px;gap:7px;min-height:65px}
 header .brand{min-width:0}header .brand b{font-size:17px}
 header .logo{width:44px;height:44px;flex-shrink:0}
 header .iconbtn{padding:7px;min-width:34px}
 .layout{display:block!important;min-width:0}
 nav{top:61px;gap:3px;max-width:100vw;scrollbar-width:thin;overscroll-behavior-x:contain}
 nav button{font-size:13px;padding:9px 10px;flex-shrink:0}
 main,.layout main{width:100%!important;max-width:100%!important;padding:11px!important;min-width:0}
 .toolbar{flex-wrap:wrap;gap:8px}
 .card{padding:13px;border-radius:14px}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
 .stat{padding:11px}.stat b{font-size:20px}
 h1{font-size:21px}h2{font-size:18px}
 .btn,.back{min-height:42px;touch-action:manipulation}
 .option{padding:13px 12px;min-height:50px;line-height:1.5;overflow-wrap:anywhere}
 .profiletop{padding:13px;gap:10px;flex-wrap:wrap}
 .student-name{font-size:24px}
 .es-premium-banner{min-height:360px!important;border-radius:17px!important}
 .es-premium-content{padding:21px 16px 110px!important;max-width:100%!important}
 .es-premium-welcome{font-size:clamp(19px,5.2vw,25px)!important}
 .es-premium-name{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
 .es-premium-name span{font-size:clamp(21px,6vw,29px)}
 .es-premium-content h2{font-size:clamp(21px,5.4vw,27px)!important;line-height:1.3}
 .es-premium-content p{font-size:14px;max-width:80%}
 .es-premium-boy-art{width:100%!important;height:72%!important;top:auto!important;bottom:0!important;right:0!important;opacity:.65!important;background-position:65% 60%!important;background-size:cover!important}
 .es-premium-banner:after{background:linear-gradient(180deg,rgba(238,247,255,.99) 0%,rgba(238,247,255,.92) 44%,rgba(238,247,255,.2) 100%)!important}
 .es-premium-quick{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:9px!important}
 .es-premium-tile{min-width:0;padding:12px 9px!important}
 .es-premium-tile-icon{font-size:22px!important}
 .auth-card{padding:17px!important}
 .field input,.field select,.field textarea{font-size:16px}
 .submit-top-actions{gap:7px!important}.submit-top-actions .btn{flex:1 1 130px}
 .qheading{gap:7px}.qheading h2{min-width:0;flex-basis:100%}
 .omr-sidebar{max-width:100%;min-width:0;overscroll-behavior:contain}

async function initOnlineAuth(){
 if(!sb){authError='Supabase SDK लोड नहीं हुआ। इंटरनेट जाँचें।';render();return}
 try{const {data:{session},error}=await sb.auth.getSession();if(error)throw error;
  if(session?.user){await applyOnlineUser(session.user);page='home'}else page='login';
  sb.auth.onAuthStateChange((_event,session)=>{if(!session?.user){currentUser=null;loggedIn=false;admin=false;if(page!=='signup'&&page!=='forgot'&&page!=='verify-email')page='login';render()}});
 }catch(e){authError=e.message||'Login connection failed';page='login'}render();
}
async function applyOnlineUser(user){currentUser=user;loggedIn=true;loginEmail=user.email||'';
 let name=user.user_metadata?.full_name||user.user_metadata?.name||'Student';
 // Display name comes from Supabase Auth metadata; profiles table does not exist.
 demoAccount={name,email:user.email,id:user.id};
 await loadOnlineExams();
 esHeartbeat();
 // Role is checked again on admin entry. Never infer admin from a client-stored flag.
}
async function registerDemo(){
 const name=document.getElementById('signupName')?.value.trim()||'';
 const email=document.getElementById('signupEmail')?.value.trim().toLowerCase()||'';
 const pw=document.getElementById('signupPassword')?.value||'';
 const confirm=document.getElementById('signupConfirm')?.value||'';
 if(!name||!/^\S+@\S+\.\S+$/.test(email)||pw.length<8||pw!==confirm){authError='नाम, सही Email और समान Password (कम से कम 8 अक्षर) डालें।';render();return}
 if(!sb){authError='Internet / Supabase SDK उपलब्ध नहीं है';render();return}
 try{
  const {data,error}=await sb.auth.signUp({email,password:pw,options:{data:{full_name:name}}});if(error)throw error;
  pendingVerificationEmail=email;loginEmail=email;authError='';
  if(data?.session?.user){await applyOnlineUser(data.user);go('home');return}
  page='verify-email';render();
 }catch(e){authError=e.message||'Signup failed';render()}
}
async function verifySignupOtp(){
 const email=pendingVerificationEmail||loginEmail;
 const token=(document.getElementById('signupOtp')?.value||'').trim();
 if(!email||!/^\d{6}$/.test(token)){authError='कृपया 6 अंकों का OTP डालें।';render();return}
 try{
  const {data,error}=await sb.auth.verifyOtp({email,token,type:'signup'});if(error)throw error;
  authError='';pendingVerificationEmail='';
  if(data?.user&&data?.session){await applyOnlineUser(data.user);go('home')}
  else{authError='Email Verify हो गया। अब Password से Login करें।';page='login';render()}
 }catch(e){authError=e.message||'OTP verification failed';render()}
}
async function resendSignupOtp(){
 const email=pendingVerificationEmail||loginEmail;
 if(!email){authError='पहले Registration करें।';page='signup';render();return}
 try{const {error}=await sb.auth.resend({type:'signup',email});if(error)throw error;
  authError='नया OTP भेजने का अनुरोध सफल हुआ। Gmail Inbox और Spam देखें।';render();
 }catch(e){authError=e.message||'OTP भेजने में समस्या आई';render()}
}

async function openAdminOnline(){
 if(!sb){alert('Supabase connection उपलब्ध नहीं है।');return}
 const {data:sessionData,error:sessionError}=await sb.auth.getUser();
 const user=sessionData?.user;
 if(sessionError||!user){authError='पहले Login करें';go('login');return}
 currentUser=user;

 admin=true;go('admin');
}

async function loadOnlineExams(){
 if(!sb||!currentUser)return;onlineLoadState='loading';
 try{
  const {data,error}=await sb.from('exams').select('id,title,category,description,duration,marks,negative,published,is_paid,price,cutoff_marks,created_at').eq('published',true).order('created_at',{ascending:false}).limit(200);

  onlineExams=(data||[]).map(e=>({...e,duration_minutes:e.duration,negative_mark:e.negative}));

  try{const ranks=await onlineRpc('examsetu_my_status',{});for(const r of ranks||[])onlineRanks[r.exam_id]=r;}catch(e){console.warn('Rank unavailable:',e.message)}

  try{
   const {data:finished,error:finishedError}=await sb.from('results')
    .select('id,exam_id,score,max_score,percent,details,submitted_at')
    .eq('student_id',currentUser.id).order('submitted_at',{ascending:true}).limit(500);
   if(finishedError)throw finishedError;
   for(const r of finished||[]){
    if(!onlineRanks[r.exam_id]||onlineRanks[r.exam_id].status!=='submitted')
     onlineRanks[r.exam_id]={...(onlineRanks[r.exam_id]||{}),status:'submitted',score:r.score,result:r};
   }
   // Rank is computed from all students' saved first results, never from demo data.
   await Promise.all((finished||[]).map(async r=>{

    }catch(e){console.warn('Rank load failed:',e.message)}
   }));
  }catch(e){console.warn('Submitted results status unavailable:',e.message)}
  // Recover submitted status from the same authenticated RPC used by the exam screen.
  // This also covers legacy results whose student_id is not the auth UUID.
  await Promise.all((onlineExams||[]).map(async e=>{
   if(onlineRanks[e.id]?.status==='submitted')return;
   try{
    const r=await onlineRpc('examsetu_first_result',{p_exam_id:Number(e.id)});
    if(r?.submitted){onlineRanks[e.id]={...(onlineRanks[e.id]||{}),status:'submitted',score:r.score,rank:r.rank,participants:r.participants,result:{score:r.score,max_score:r.max_score,submitted_at:r.submitted_at}};}
   }catch(err){console.warn('Submitted exam lookup:',e.id,err.message)}
  }));
  // Read the student's real paused/active attempts even when optional rank RPC is unavailable.
  try{const {data:attemptRows,error:attemptErr}=await sb.from('exam_attempts').select('id,exam_id,status').eq('user_id',currentUser.id).in('status',['active','paused']).order('id',{ascending:false}).limit(200);if(attemptErr)throw attemptErr;for(const a of attemptRows||[]){if(!onlineRanks[a.exam_id]||onlineRanks[a.exam_id].status!=='submitted')onlineRanks[a.exam_id]={...(onlineRanks[a.exam_id]||{}),status:a.status,attempt_id:a.id};}}catch(e){console.warn('Attempt status unavailable:',e.message)}
  try{const totals=await onlineRpc('examsetu_exam_participants',{});for(const r of totals||[])onlineRanks[r.exam_id]={...(onlineRanks[r.exam_id]||{}),participants:r.participants};}catch(e){}
 }catch(e){onlineLoadState='error: '+e.message}
 if(['home','tests','online-exams','my-results'].includes(page))render();
}
async function esLoadFinalResult(id){

 onlineExamQuestions=(r.questions||[]).map(q=>({id:q.question_id,question_text:q.question_text,question_text_en:q.question_text_en||q.text_en,options:q.options,options_en:q.options_en,solution:q.solution_hi||q.detailed_solution_hi||q.solution,solution_en:q.solution_en||q.detailed_solution_en,question_order:q.question_no}));
 onlineRanks[id]={...(onlineRanks[id]||{}),status:'submitted',score:r.score,rank:r.rank,participants:r.participants};

async function showOnlineExamQuestions(id, approved=false){
 if(!sb||!currentUser){alert('Exam शुरू करने के लिए Student Login करें।');return;}
 const item=onlineExams.find(x=>String(x.id)===String(id));
 if(!item){alert('Exam नहीं मिला।');return;}
 if(onlineAttempt&&Number(onlineAttempt.examId)!==Number(item.id)){
  if(onlineAttempt.submitting){alert('Submit चल रहा है।');return;}
  if(onlineAttemptTimer)clearInterval(onlineAttemptTimer);
  onlineAttemptTimer=null;onlineAttempt=null;onlinePaused=false;
 }
 onlineSelectedExam=item;
 // Read saved first result from a server RPC before allowing any new attempt.
 try{
  if(await esLoadFinalResult(id)){go('online-result');return;}
 }catch(e){alert('Result verification failed: '+e.message+'\nSupabase Final SQL पहले चलाएँ।');return;}
 if(item.is_paid&&!admin){
  try{
   const {data:hasAccess,error:accessError}=await sb.rpc('examsetu_my_paid_access');
   if(accessError)throw accessError;
   if(hasAccess!==true){alert('🔒 Paid Exam: Admin से Access प्राप्त करें।');return;}
  }catch(e){alert('Paid Access जाँच विफल: '+e.message);return;}
 }
 if(!approved){onlineExamQuestions=[];onlineQuestionState='ready';onlinePaused=onlineRanks[item.id]?.status==='paused';go('online-questions');return;}
 onlineExamQuestions=[];onlineQuestionState='loading';go('online-questions');
 try{
  // Start/resume authorization must happen before the secure question RPC.
  const authorization=await onlineRpc('examsetu_start_attempt',{p_exam_id:Number(item.id)});
  if(authorization?.status==='submitted'){await esLoadFinalResult(item.id);go('online-result');return;}
  const {data,error}=await sb.rpc('examsetu_get_exam_questions',{p_exam_id:Number(item.id)});
  if(error)throw error;
  onlineExamQuestions=(data||[]).map(q=>({id:q.id,question_text:q.text,question_text_en:q.text_en,options:q.options,options_en:q.options_en,solution:'',solution_en:'',question_order:q.question_no,marks:Number(item.marks)||3}));
  if(!onlineExamQuestions.length)throw Error('इस Exam के प्रश्न उपलब्ध नहीं हैं।');
  onlineQuestionState='ready';
  const {data:attempts,error:attemptError}=await sb.from('exam_attempts').select('id,exam_id,status,answers,remaining_seconds,started_at,updated_at').eq('exam_id',item.id).eq('user_id',currentUser.id).in('status',['active','paused']).order('id',{ascending:false}).limit(1);
  if(attemptError)throw attemptError;
  if(attempts?.length){
   const a=attempts[0];onlineRestore({status:a.status,remaining_seconds:a.remaining_seconds,attempt:a});
   if(a.status==='active'){await onlineStartAttempt();return;}
   if(a.status==='paused'){await onlineStartAttempt();return;}
  }
 }catch(e){onlineQuestionState='error: '+e.message;onlineAttempt=null;onlinePaused=false;console.error('Exam load failed:',e);alert('Exam Safety Check: '+e.message);}
 render();
}

function esCanonicalCategory(value){
 let n=String(value||'').trim().replace(/\s*\/\s*/g,' / ').replace(/\s+/g,' ');
 // Collapse redundant nested folder labels, but keep different exams distinct.
 const parts=n.split(' / ').map(x=>x.trim()).filter(Boolean);
 const cleaned=[];
 for(const part of parts){if(!cleaned.some(x=>x.toLowerCase()===part.toLowerCase()))cleaned.push(part)}
 if(cleaned.length>1 && /^(teaching|ssc|railway)$/i.test(cleaned[0]))cleaned.shift();
 n=cleaned.join(' / ')||'Other Exams';
 if(/^(up exams\s*\/\s*)?super\s*tet$/i.test(n)||/^(up exams\s*\/\s*)?up\s*super\s*tet$/i.test(n))return 'UP Exams / Super TET';
 if(/^(up exams\s*\/\s*)?(up\s*)?primary\s*teacher$/i.test(n))return 'UP Exams / Primary Teacher';
 return n;
}
function esOnlineSeriesGroups(){
 const groups=new Map();
 for(const e of onlineExams){
  let name=String(e.category||'').trim();
  if(!name||/^(general|other|others|test|mock)$/i.test(name)){
   const title=String(e.title||'');
   name=/super\s*tet/i.test(title)?'Super TET':/primary\s*teacher|प्राथमिक शिक्षक/i.test(title)?'UP Primary Teacher':/upsssc|pet/i.test(title)?'UPSSSC PET':/police/i.test(title)?'UP Police':/ssc/i.test(title)?'SSC':/railway|rrb/i.test(title)?'Railway':'Other Exams';
  }
  name=esCanonicalCategory(name);
  const key=name.toLowerCase();
  if(!groups.has(key))groups.set(key,{name,items:[]});
  groups.get(key).items.push(e);
 }
 return [...groups.values()];
}

function onlineRestore(st){
 const a=st.attempt||st;
 const remaining=Number(st.remaining_seconds??a.remaining_seconds??onlineSelectedExam.duration*60);
 const byId={};
 const raw=a.answers||{};
 if(Number(a.exam_id??st.exam_id??onlineSelectedExam.id)!==Number(onlineSelectedExam.id))throw Error("Attempt दूसरे Exam का है।");
 onlineValidateStoredAnswers(raw);
 for(let i=0;i<onlineExamQuestions.length;i++){
  const q=onlineExamQuestions[i];
  if(Object.prototype.hasOwnProperty.call(raw,String(q.id)))byId[i]=raw[String(q.id)];
 }
 onlineAttempt={
  id:a.id??st.attempt_id,
  examId:onlineSelectedExam.id,title:onlineSelectedExam.title,questionIds:onlineExamQuestions.map(q=>Number(q.id)),
  answers:byId,visited:raw._visited||{0:true},review:raw._review||{},index:Math.max(0,Math.min(onlineExamQuestions.length-1,Number(raw._index)||0)),
  remaining,ends:Date.now()+remaining*1000,submitting:false
 };
 onlinePaused=st.status==='paused';
 onlineOMR=window.matchMedia("(min-width:901px)").matches;onlineRunClock();
}
async function onlineStartAttempt(){
 if(onlineSelectedExam?.is_paid&&!admin){try{const {data,error}=await sb.rpc('examsetu_my_paid_access');if(error)throw error;if(data!==true){alert('🔒 Paid Exam: Admin से Access प्राप्त करें।');return;}}catch(e){alert('Access check error: '+e.message);return;}}

 // Server-side locking is also required; never trust a cached card status.
 if(onlineSelectedExam && onlineRanks[onlineSelectedExam.id]?.status==='submitted'){
  alert('यह Exam पहले Submit हो चुका है। Solution या Analysis देखें।');return;
 }

 if(onlineBusy||onlineQuestionState!=='ready'||!onlineExamQuestions.length){
  alert('Questions तैयार नहीं हैं। कृपया Exam दोबारा खोलें।');return;
 }
 onlineBusy=true;
 try{
  // If this student already has a paused attempt, resume it instead of creating a duplicate.
  if(onlineAttempt&&onlinePaused&&onlineAttempt.id){
   const a=onlineAttempt;
   onlineAssertIntegrity(a);
   const st=await onlineRpc('examsetu_resume_attempt',{p_attempt_id:Number(a.id)});
   if(st?.status==='submitted'){
    await esLoadFinalResult(onlineSelectedExam.id);onlineAttempt=null;onlinePaused=false;go('online-result');return;
   }
   a.remaining=Number(st?.remaining_seconds??a.remaining??onlineSelectedExam.duration*60);
   a.ends=Date.now()+a.remaining*1000;
   onlinePaused=false;onlineOMR=window.matchMedia("(min-width:901px)").matches;onlineRunClock();go('online-attempt');onlineFullScreen();return;
  }
  const st=await onlineRpc('examsetu_start_attempt',{p_exam_id:Number(onlineSelectedExam.id)});
  if(st?.status==='submitted'){await esLoadFinalResult(onlineSelectedExam.id);go('online-result');return;}
  onlineRestore(st);
  onlineOMR=window.matchMedia("(min-width:901px)").matches;
  go('online-attempt');
  onlineFullScreen();
 }catch(e){
  console.error('Start/Resume failed:',e);
  alert('Start/Resume Error: '+e.message);
 }finally{onlineBusy=false}
}
function onlineFullScreen(){try{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.().catch(()=>{});}catch(e){}}
function onlineRunClock(){if(onlineAttemptTimer)clearInterval(onlineAttemptTimer);if(!onlinePaused&&onlineAttempt)onlineAttemptTimer=setInterval(onlineTick,1000)}
function onlineTick(){if(!onlineAttempt||onlinePaused)return;const remain=Math.max(0,Math.ceil((onlineAttempt.ends-Date.now())/1000));const el=document.getElementById('online-clock');if(el)el.textContent=onlineClockText(remain);if(remain===0){clearInterval(onlineAttemptTimer);onlineAttemptTimer=null;onlineSubmit(true)}}
function onlinePick(i){if(!onlineAttempt||onlinePaused||onlineAttempt.submitting)return;const n=onlineAttempt.index;onlineAttempt.answers[n]===i?delete onlineAttempt.answers[n]:onlineAttempt.answers[n]=i;render();onlineQueueProgressSave()}
function onlineNavigate(i){if(!onlineAttempt||onlinePaused||onlineAttempt.submitting)return;onlineAttempt.index=Math.max(0,Math.min(onlineExamQuestions.length-1,i));onlineAttempt.visited[onlineAttempt.index]=true;render();onlineQueueProgressSave();}
function onlineToggleReview(){if(!onlineAttempt||onlinePaused)return;const i=onlineAttempt.index;onlineAttempt.review[i]=!onlineAttempt.review[i];render();onlineQueueProgressSave()}
function onlineToggleOMR(){onlineOMR=!onlineOMR;render()}
let onlineSaveChain=Promise.resolve();
function onlineAssertIntegrity(a=onlineAttempt){
 if(!a||!onlineSelectedExam||Number(a.examId)!==Number(onlineSelectedExam.id))throw Error('Exam mismatch: दूसरे Exam का Attempt लोड हुआ है।');
 if(!onlineExamQuestions.length||onlineExamQuestions.some(q=>!Number.isSafeInteger(Number(q.id))))throw Error('Question IDs उपलब्ध नहीं हैं।');
 const ids=new Set(onlineExamQuestions.map(q=>Number(q.id)));
 if(ids.size!==onlineExamQuestions.length)throw Error('Duplicate Question IDs मिली हैं।');
 if(a.questionIds && (a.questionIds.length!==onlineExamQuestions.length||a.questionIds.some((id,i)=>Number(id)!==Number(onlineExamQuestions[i].id))))throw Error('Exam Questions बदल गए हैं। सुरक्षित रहने के लिए Exam दोबारा खोलें।');
 return ids;
}
function onlineValidateStoredAnswers(raw){
 const ids=new Set(onlineExamQuestions.map(q=>String(q.id)));
 const invalid=Object.keys(raw||{}).filter(k=>/^\d+$/.test(k)&&!ids.has(k));
 if(invalid.length)throw Error('इस Attempt में '+invalid.length+' उत्तर दूसरे Exam की Question IDs से जुड़े हैं। Answers सुरक्षित हैं; Submit बंद है। Admin से जाँच करवाएँ।');
}

function onlineQueueProgressSave(){
 const id=onlineAttempt?.id;
 if(!id||onlinePaused)return;
 let payload;try{payload=onlineProgressPayload()}catch(e){alert(e.message);return;}
 onlineSaveChain=onlineSaveChain.catch(()=>{}).then(async()=>{
  if(!onlineAttempt||onlineAttempt.id!==id||onlinePaused)return;
  onlineAssertIntegrity(onlineAttempt);
  return onlineRpc('examsetu_save_progress',{p_attempt_id:Number(id),p_answers:payload});
 }).catch(e=>console.warn('Autosave failed:',e.message));
}
function onlineProgressPayload(){
 const a=onlineAttempt;onlineAssertIntegrity(a);
 const payload={_index:a.index,_visited:a.visited,_review:a.review};
 for(const [index,value] of Object.entries(a.answers)){
  const q=onlineExamQuestions[Number(index)];
  if(q && Number.isInteger(Number(value)) && Number(value)>=0 && Number(value)<=3) payload[String(q.id)]=Number(value);
 }
 return payload;
}
async function onlineSaveProgress(){
 if(!onlineAttempt?.id || onlinePaused)return;
 return onlineRpc('examsetu_save_progress',{
  p_attempt_id:Number(onlineAttempt.id),p_answers:onlineProgressPayload()
 });
}

function esConfirm(message){return new Promise(resolve=>{
 const shade=document.createElement('div');shade.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:2147483647;display:flex;align-items:center;justify-content:center;padding:20px';
 const panel=document.createElement('div');panel.style.cssText='background:#fff;color:#1a293b;border-radius:13px;padding:24px 20px 15px;width:min(100%,380px);box-shadow:0 12px 38px #0006;font:16px system-ui,sans-serif';
 const msg=document.createElement('div');msg.textContent=message;msg.style.cssText='white-space:pre-wrap;line-height:1.6;margin-bottom:24px';
 const actions=document.createElement('div');actions.style.cssText='display:flex;justify-content:flex-end;gap:14px';
 const done=(v)=>{shade.remove();resolve(v)};
 for(const [label,value] of [['CANCEL',false],['OK',true]]){const b=document.createElement('button');b.type='button';b.textContent=label;b.style.cssText='border:0;background:transparent;color:#008577;font-size:14px;font-weight:700;padding:10px;cursor:pointer';b.onclick=()=>done(value);actions.appendChild(b)}
 panel.append(msg,actions);shade.appendChild(panel);document.body.appendChild(shade);
 });}

async function onlinePauseResume(){
 if(!onlineAttempt||onlineBusy)return;
 if(!onlinePaused&&!(await esConfirm('क्या आप Exam Pause करके बाहर जाना चाहते हैं?')))return;
 onlineBusy=true;
 try{
  const a=onlineAttempt;
  if(!a.id)throw Error('Attempt ID उपलब्ध नहीं है। Exam दोबारा खोलें।');
  const wasPaused=onlinePaused;
  const remaining=wasPaused?a.remaining:Math.max(0,Math.ceil((a.ends-Date.now())/1000));
  onlineAssertIntegrity(a);
  if(!wasPaused){await onlineSaveChain;await onlineSaveProgress();}
  const st=wasPaused
   ?await onlineRpc('examsetu_resume_attempt',{p_attempt_id:Number(a.id)})
   :await onlineRpc('examsetu_pause_attempt',{p_attempt_id:Number(a.id),p_remaining_seconds:remaining});
  const status=st?.status||(wasPaused?'active':'paused');
  if(status==='submitted'){await esLoadFinalResult(onlineSelectedExam.id);onlineAttempt=null;go('online-result');return;}
  a.remaining=Number(st?.remaining_seconds??remaining);
  a.ends=Date.now()+a.remaining*1000;
  onlinePaused=status==='paused';
  onlineRunClock();
  if(onlinePaused){
   if(document.fullscreenElement)document.exitFullscreen?.().catch(()=>{});
   go('home');
  }else{go('online-attempt');onlineFullScreen();}
 }catch(e){console.error('Pause/Resume failed:',e);alert('Pause/Resume Error: '+e.message)}finally{onlineBusy=false}
}
async function onlineSubmit(automatic=false){
 const a=onlineAttempt;if(!a||a.submitting)return;
 const count=Object.keys(a.answers).length;
 if(!automatic&&!confirm('Exam Submit करें?\nAttempted: '+count+'/'+onlineExamQuestions.length+'\nएक बार Submit के बाद दोबारा Attempt नहीं मिलेगा।'))return;
 a.submitting=true;clearInterval(onlineAttemptTimer);onlineAttemptTimer=null;render();
 esProcessingShow();
 try{
  if(!a.id)throw Error('Attempt ID उपलब्ध नहीं है।');
  onlineAssertIntegrity(a);
  await onlineSaveChain;
  const {data:serverAttempt,error:serverError}=await sb.from('exam_attempts').select('id,exam_id,answers,status').eq('id',a.id).eq('user_id',currentUser.id).single();
  if(serverError)throw Error('Attempt verification failed: '+serverError.message);
  if(Number(serverAttempt.exam_id)!==Number(a.examId))throw Error('Server Attempt का Exam अलग है।');
  onlineValidateStoredAnswers(serverAttempt.answers||{});
  const answers={};
  for(const [index,value] of Object.entries(a.answers)){
   const q=onlineExamQuestions[Number(index)];
   if(q&&Number.isInteger(Number(value))&&Number(value)>=0&&Number(value)<=3)answers[String(q.id)]=Number(value);
  }
  if(Object.keys(answers).length!==Object.keys(a.answers).length)throw Error('Answers count mismatch; Submit रोका गया।');
  const st=await onlineRpc('examsetu_submit_attempt',{p_attempt_id:Number(a.id),p_answers:answers});
  onlineAttempt=null;onlinePaused=false;
  await esLoadFinalResult(onlineSelectedExam.id);
  await loadOnlineExams();go('online-result');
  await esProcessingHide();
  // Only a newly accepted original submission celebrates; retries/practice never do.
  if(st && st.already_submitted!==true && st.status!=='already_submitted' && st.submitted!==false)esShowCelebration();
  if(document.fullscreenElement)document.exitFullscreen?.().catch(()=>{});
 }catch(e){await esProcessingHide();a.submitting=false;onlineRunClock();console.error('Submit failed:',e);alert('Submit Error: '+e.message);render()}
}

function esSectionLanguage(question,index){
 const raw=[question?.section,question?.subject,question?.category,question?.section_name,question?.subject_name].filter(Boolean).join(' ').toLowerCase();
 if(/sanskrit|संस्कृत/.test(raw))return 'hi';
 if(/english|अंग्रेजी|अंग्रेज़ी/.test(raw))return 'en';
 if(/hindi|हिन्दी|हिंदी/.test(raw))return 'hi';
 // The Super TET 120-question paper has fixed language sections.
 const examTitle=String(onlineSelectedExam?.title||onlineAttempt?.title||'').toLowerCase();
 if(/super\s*tet|सुपर\s*टेट/.test(examTitle)&&Number.isInteger(index)){
   if(index>=30&&index<50)return 'hi'; // Hindi and Sanskrit
   if(index>=50&&index<60)return 'en'; // English
 }
 return null;
}
function esEffectiveLang(question,index,selected){return esSectionLanguage(question,index)||selected;}

function go(p){if(p==='online-attempt'&&onlinePaused)p='home';if(!loggedIn&&!admin&&!['signup','login','forgot','verify-email','admin-login','admin'].includes(p))p='login';if(page==='exam'&&p!=='exam'&&p!=='review'&&mode==='test'&&timer){stopClock()}if(p!==page)stack.push(page);page=p;render();window.scrollTo(0,0);if(p==='tests')filterSeries(window.examSearchTerm||'')}
function back(){
 // Practice/Solution is read-only review: exit silently, without an unsaved-answers warning.
 if(page==='exam'&&mode==='practice'){exitPractice();return;}
 // Never leave an active online exam using Back; pause or submit it first.
 if(page==='online-attempt'&&onlineAttempt&&!onlinePaused)return;
 if(page==='exam'&&mode==='test')return;
 if(['signup','login','forgot','verify-email'].includes(page))return;
 // Folder view is a subpage of the exam list, not Home.
 if((page==='tests'||page==='online-exams')&&onlineSeriesSelected!==null){
   onlineSeriesSelected=null;render();window.scrollTo(0,0);return;
 }
 if(page==='exam'&&timer)stopClock();
 const from=page;
 let previous=stack.pop();
 while(stack.length&&(previous===from||previous==='online-attempt'&&onlineAttemptResult||previous==='online-questions'&&onlineAttemptResult))previous=stack.pop();
 if(!previous||previous===from){
   previous=['online-result','online-solution','online-questions','online-attempt'].includes(from)?'tests':(admin?'admin':'home');
 }
 if(previous==='exam'&&mode==='test')previous='tests';
 // Keep submitted result in memory when navigating Solution -> Result.
 if(from==='online-result'&&previous!=='online-solution')onlineAttempt=null;
 page=previous;
 render();window.scrollTo(0,0);
}

function esAvatarHtml(a){const src=a==='custom'?localStorage.getItem('examsetu_custom_avatar'):ES_AVATAR_IMAGES[a];return `<img class="es-avatar-image" src="${src||ES_AVATAR_IMAGES.boy1}" alt="Profile">`;}
function esUploadProfilePhoto(input){const file=input.files?.[0];if(!file)return;input.value='';if(!file.type.startsWith('image/'))return alert('Image चुनें');const im=new Image();const reader=new FileReader();reader.onload=()=>{im.onload=()=>{const c=document.createElement('canvas');const scale=Math.min(1,240/Math.max(im.width,im.height));c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);try{localStorage.setItem('examsetu_custom_avatar',c.toDataURL('image/jpeg',.75));localStorage.setItem(STUDENT_AVATAR_KEY,'custom');render()}catch(e){alert('Photo save नहीं हो पाई')}};im.src=reader.result};reader.readAsDataURL(file)}
function studentAvatar(){try{const a=localStorage.getItem(STUDENT_AVATAR_KEY);return (STUDENT_AVATARS.includes(a)||a==='custom')?a:'boy1'}catch(e){return 'boy1'}}
function chooseStudentAvatar(a){if(!loggedIn||!STUDENT_AVATARS.includes(a))return;localStorage.setItem(STUDENT_AVATAR_KEY,a);render()}
function profile(){go('profile')}
function clockTick(){if(page!=='exam'||mode!=='test')return;let now=Date.now(),dt=Math.max(0,Math.floor((now-lastTick)/1000));if(dt){seconds=Math.max(0,seconds-dt);elapsed[qi]+=dt;lastTick=now}let el=$('clock');if(el)el.textContent='⏱ '+fmt(seconds);let topEl=$('exam-top-clock');if(topEl)topEl.textContent=fmt(seconds);let qtime=$('qtime');if(qtime)qtime.textContent=fmt(elapsed[qi]);if(seconds<=300){[el,topEl].forEach(node=>{if(node){node.style.color='#dc2626';node.style.fontWeight='800'}})}if(dt&&seconds>0&&seconds%15<Math.max(1,dt))esAutoSaveExam();if(seconds===0)finish()}
function stopClock(){clockTick();clearInterval(timer);timer=null}
function resumeClock(){clearInterval(timer);lastTick=Date.now();timer=setInterval(clockTick,1000)}
const PAUSED_EXAM_KEY='examsetu_paused_exam_v1';
function pausedExamInfo(){try{const r=JSON.parse(localStorage.getItem(PAUSED_EXAM_KEY)||'null');return r&&r.owner===demoAccount?.email?r:null}catch(e){return null}}
function savePausedExam(){if(mode!=='test'||page!=='exam')return;const state={owner:demoAccount?.email,exam,seconds,qi,answers:{...answers},review:{...review},elapsed:[...elapsed],visited:{...visited},omrVisible,filter,lang,activeExamMinutes,activeNegativeMark,data:JSON.parse(JSON.stringify(data)),savedAt:Date.now()};try{localStorage.setItem(PAUSED_EXAM_KEY,JSON.stringify(state))}catch(e){throw e}}
async function pauseExam(){if(page!=='exam'||mode!=='test')return;if(!(await esConfirm('परीक्षा Pause करके Home पर जाएँ? आपका समय और उत्तर यहीं सुरक्षित रहेंगे।')))return;clockTick();clearInterval(timer);timer=null;try{savePausedExam()}catch(e){resumeClock();return}exitExamFullscreen();page='home';stack=[];render();window.scrollTo(0,0)}
function resumePausedExam(){const state=pausedExamInfo();if(!state){alert('कोई Paused Exam नहीं मिली।');return}if(!confirm('"'+state.exam+'" वहीं से फिर शुरू करें?'))return;exam=state.exam;data=state.data;seconds=state.seconds;qi=state.qi;answers=state.answers||{};review=state.review||{};elapsed=state.elapsed||Array(data.length).fill(0);visited=state.visited||{};omrVisible=state.omrVisible!==false;filter=state.filter||'all';lang=state.lang||'hi';activeExamMinutes=state.activeExamMinutes;activeNegativeMark=state.activeNegativeMark;mode='test';page='exam';stack=[];enterExamFullscreen();render();resumeClock()}
// Keep the existing explicit Pause/Resume format; silently checkpoint in the same format.
let esAutoSaveWarningShown=false;
function esAutoSaveExam(){
 if(mode!=='test'||page!=='exam')return;
 try{savePausedExam()}catch(e){if(!esAutoSaveWarningShown){esAutoSaveWarningShown=true;console.warn('Exam autosave unavailable',e)}}
}
window.addEventListener('pagehide',()=>{if(page==='exam'&&mode==='test')esAutoSaveExam()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&page==='exam'&&mode==='test')esAutoSaveExam()});
function clearPausedExam(){localStorage.removeItem(PAUSED_EXAM_KEY)}

async function esOpenPaidPracticeFromLibrary(examId){
 const item=onlineExams.find(e=>String(e.id)===String(examId));
 if(!item)return alert('Exam नहीं मिला।');
 if(item.is_paid&&!admin){
  try{const {data,error}=await sb.rpc('examsetu_my_paid_access');if(error)throw error;if(data!==true)return alert('🔒 Paid Practice के लिए Admin Access जरूरी है।');}
  catch(e){return alert('Paid Access जाँच विफल: '+e.message);}
 }
 // Paid practice needs a server-side practice RPC before question/answer content can be shown.

function openLibraryExam(title,practice=false){exam=title;const item=importedExams.find(x=>x.title===title&&x.published);if(item?.is_paid){const live=onlineExams.find(e=>String(e.id)===String(item.id)||e.title===item.title);if(live){if(practice){esOpenPaidPracticeFromLibrary(live.id);return;}showOnlineExamQuestions(live.id);return;}alert('Paid Exam अभी Online Exams सूची में उपलब्ध नहीं है।');return;}if(item){data=item.questions.map(q=>({subject:q.subject||'General',q:{hi:q.text,en:q.text_en||q.en||q.text},opts:{hi:q.options,en:Array.isArray(q.options_en)?q.options_en:q.options},a:q.answer??q.correct,sol:{hi:q.solution||'Solution not provided',en:q.solution_en||q.solution||'Solution not provided'},marks:Number(q.marks??item.marks_per_question??3)}));activeExamMinutes=Number(item.minutes)||70;activeNegativeMark=Number(item.negative_mark)||0}else{data=demoData.map(q=>({...q,marks:3}));activeExamMinutes=70;activeNegativeMark=1}start(practice)}

function esCountAnswers(details){
 const obj=details&&typeof details==='object'?details:null;
 if(!obj)return null;
 const n=k=>Number.isFinite(Number(obj[k]))?Number(obj[k]):null;
 const correct=n('correct_count')??n('correctCount')??n('correct');
 const wrong=n('wrong_count')??n('wrongCount')??n('wrong');
 const skipped=n('unattempted_count')??n('unattempted')??n('skipped');
 if(correct!==null&&wrong!==null&&skipped!==null)return {correct,wrong,skipped};
 const items=Array.isArray(obj)?obj:(Array.isArray(obj.questions)?obj.questions:Array.isArray(obj.answers)?obj.answers:null);
 if(!items||!items.length||typeof items[0]!=='object')return null;
 let c=0,w=0,skip=0,known=0;
 for(const q of items){const chosen=q.selected??q.selected_index??q.user_answer??q.answer_selected;const key=q.correct_index??q.correct_answer??q.correct; if(key===undefined)continue;known++;if(chosen===null||chosen===undefined||chosen===''||chosen===-1)skip++;else if(String(chosen)===String(key))c++;else w++;}
 return known===items.length?{correct:c,wrong:w,skipped:skip}:null;
}

function applyPageLanguage(){
 const practiceExitLabel=document.getElementById('practice-exit-label');if(practiceExitLabel)practiceExitLabel.textContent=lang==='hi'?'बाहर जाएँ':'Exit Practice';
 const langBtn=$('global-language');if(langBtn)langBtn.textContent=lang==='hi'?'🌐 EN':'🌐 HI';
 if(lang!=='hi')return;
 for(const root of [$('main'),$('nav')]){
  if(!root)return;
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
  let node;while((node=walker.nextNode())){
   const val=node.nodeValue,trim=val.trim();if(!trim)continue;
   if(uiTranslations[trim])node.nodeValue=val.replace(trim,uiTranslations[trim]);
   else if(trim.startsWith('👤 Demo Student'))node.nodeValue=val.replace('Demo Student',uiTranslations['Demo Student']);
   else if(trim.startsWith('🏠 Home'))node.nodeValue=val.replace('Home',uiTranslations.Home);
   else if(trim.startsWith('📝 Exams'))node.nodeValue=val.replace('Exams',uiTranslations.Exams);
   else if(trim.startsWith('📜 History'))node.nodeValue=val.replace('History',uiTranslations.History);
   else if(trim.startsWith('📚 Notes'))node.nodeValue=val.replace('Notes',uiTranslations.Notes);
   else if(trim.startsWith('🏆 Rank'))node.nodeValue=val.replace('Rank',uiTranslations.Rank);
  }
 }
}

// Folder-based JSON exam importer (Supabase online save; local editor remains legacy)
const STORE_FOLDERS='examsetu_demo_folders_v2', STORE_EXAMS='examsetu_demo_imported_v2';
let folders=[], importedExams=[], chosenFolder='', importedPreview=null, importError='', adminSelectedType='Full Mock', adminPYQYear='';
try{folders=JSON.parse(localStorage.getItem(STORE_FOLDERS)||'null')||[]}catch(e){}
try{importedExams=JSON.parse(localStorage.getItem(STORE_EXAMS)||'[]')}catch(e){}
if(!folders.length){folders=[{id:'up',name:'UP Exams',parent:null},{id:'upsssc',name:'UPSSSC',parent:'up'},{id:'pet',name:'PET',parent:'upsssc'},{id:'police',name:'UP Police',parent:'up'},{id:'supertet',name:'Super TET',parent:'up'},{id:'primary',name:'Primary Teacher',parent:'up'},{id:'ssc',name:'SSC GD',parent:null},{id:'railway',name:'Railway Group D',parent:null}];}
function saveLibrary(){try{localStorage.setItem(STORE_FOLDERS,JSON.stringify(folders));localStorage.setItem(STORE_EXAMS,JSON.stringify(importedExams))}catch(e){alert('Storage full: छोटे JSON से कोशिश करें।')}}
function folderPath(id){let parts=[],seen=new Set();while(id&&!seen.has(id)){seen.add(id);let f=folders.find(x=>x.id===id);if(!f)break;parts.unshift(f.name);id=f.parent}return parts.join(' / ')}
function folderOptions(selected='',rootOption=true){return (rootOption?'<option value="">— Folder चुनें —</option>':'')+folders.map(f=>`<option value="${esc(f.id)}" ${selected===f.id?'selected':''}>${esc(folderPath(f.id))}</option>`).join('')}
function createFolder(){const name=prompt('नए Folder / Subfolder का नाम लिखें');if(!name||!name.trim())return;let parent=chosenFolder||null;let clean=name.trim();if(folders.some(f=>f.parent===parent&&f.name.toLowerCase()===clean.toLowerCase())){alert('इस जगह इसी नाम का Folder पहले से है');return}let id='folder_'+Date.now();folders.push({id,name:clean,parent});chosenFolder=id;saveLibrary();render()}

function esRichQuestion(value){
 const input=String(value??'');
 if(!/<(?:table|svg|img)\b/i.test(input))return esc(input).replace(/\n/g,'<br>');
 const doc=new DOMParser().parseFromString('<div>'+input+'</div>','text/html');
 const allowed=new Set(['DIV','TABLE','THEAD','TBODY','TR','TH','TD','CAPTION','SVG','G','PATH','LINE','CIRCLE','ELLIPSE','RECT','POLYGON','POLYLINE','TEXT','TSPAN','DEFS','MARKER','IMG','BR','P','B','STRONG','SUB','SUP','SPAN']);
 const attrs=new Set(['viewbox','width','height','x','y','x1','y1','x2','y2','cx','cy','r','rx','ry','d','points','fill','stroke','stroke-width','stroke-linecap','stroke-linejoin','transform','text-anchor','font-size','colspan','rowspan','role','aria-label','alt','src']);
 function clean(node){
  if(node.nodeType===3)return esc(node.textContent);
  if(node.nodeType!==1)return '';
  const tag=node.tagName.toUpperCase();if(!allowed.has(tag))return '';
  const tagName=tag.toLowerCase();
  let a='';for(const at of node.attributes){const name=at.name.toLowerCase();const val=at.value;if(attrs.has(name)&&(name==='src'?/^data:image\/(?:png|jpeg|webp);base64,[A-Za-z0-9+/=]+$/.test(val):!/(?:url\s*\(|javascript:|data:|<|>)/i.test(val)))a+=' '+name+'="'+esc(val)+'"';}
  return tag==='IMG'?'<img'+a+'>':'<'+tagName+a+'>'+Array.from(node.childNodes).map(clean).join('')+'</'+tagName+'>';
 }
 return Array.from(doc.body.firstElementChild?.childNodes||[]).map(clean).join('');
}
function validateExamJSON(raw){const obj=Array.isArray(raw)?{title:exam,questions:raw}:raw;if(!obj||typeof obj!=='object'||!Array.isArray(obj.questions)||!obj.questions.length)throw Error('JSON में questions की सूची आवश्यक है।');const title=String(obj.title||exam||'').trim();if(!title)throw Error('Exam Title आवश्यक है।');const minutes=Number(obj.minutes??obj.duration??obj.duration_minutes??70);if(!Number.isFinite(minutes)||minutes<1)throw Error('minutes कम से कम 1 होना चाहिए।');const defaultMarks=Number(obj.marks_per_question??obj.marks??3);if(!Number.isFinite(defaultMarks)||defaultMarks<=0)throw Error('प्रति प्रश्न अंक 0 से अधिक होने चाहिए।');const neg=Number(obj.negative_mark??obj.negative??0);if(!Number.isFinite(neg)||neg<0)throw Error('Negative Marking 0 या उससे अधिक होनी चाहिए।');const seenQuestionTexts=new Set();const questions=obj.questions.map((q,i)=>{const text=String(q.text??q.question_text??q.question??'').trim();const options=q.options;const answer=Number(q.correct??q.answer??q.correct_index);if(!text)throw Error(`प्रश्न ${i+1}: Text आवश्यक है।`);
const normalizedText=text.toLocaleLowerCase().replace(/\s+/g,' ').trim();
if(seenQuestionTexts.has(normalizedText))throw Error(`प्रश्न ${i+1}: Duplicate Question मिला है।`);
seenQuestionTexts.add(normalizedText);
const detail=String(q.detailed_solution_hi??q.solution_hi??q.detailed_solution??q.solution??q.explanation??'').trim();
if(!detail)throw Error(`प्रश्न ${i+1}: Detailed Solution गायब है।`);if(!Array.isArray(options)||options.length!==4||options.some(x=>!String(x).trim()))throw Error(`प्रश्न ${i+1}: चार विकल्प आवश्यक हैं।`);if(!Number.isInteger(answer)||answer<0||answer>3)throw Error(`प्रश्न ${i+1}: correct/answer 0 से 3 होना चाहिए।`);const marks=Number(q.marks??defaultMarks);if(!Number.isFinite(marks)||marks<=0)throw Error(`प्रश्न ${i+1}: Marks सही डालें।`);return {text,text_en:String(q.text_en??q.en??''),options,options_en:Array.isArray(q.options_en)&&q.options_en.length===4?q.options_en:null,answer,marks,solution:String(q.solution_hi??q.detailed_solution_hi??q.solution??q.detailed_solution??q.explanation??''),solution_en:String(q.solution_en??q.detailed_solution_en??''),detailed_solution_hi:String(q.detailed_solution_hi??q.solution_hi??q.detailed_solution??q.solution??''),detailed_solution_en:String(q.detailed_solution_en??q.solution_en??''),subject:String(q.subject??'General')}});return {title,minutes,questions,type:String(obj.type||'Full Mock'),marks_per_question:defaultMarks,negative_mark:neg,folderId:chosenFolder};}
async function selectExamFile(input){let file=input.files?.[0];if(!file)return;importError='';importedPreview=null;try{if(file.size>5*1024*1024)throw Error('Demo में 5 MB तक की JSON फाइल चुनें।');let raw=JSON.parse(await file.text());importedPreview=validateExamJSON(raw);if(!chosenFolder)throw Error('पहले Folder चुनें।');exam=importedPreview.title;}catch(e){importError=e.message}render()}
async function importExamNow(){
 if(!importedPreview){alert('पहले सही JSON फाइल चुनें।');return}
 if(!chosenFolder){alert('Folder चुनें।');return}
 if(!sb||!currentUser){alert('Supabase Login आवश्यक है।');return}
 const marks=Number(document.getElementById('adminMarks')?.value??importedPreview.marks_per_question??3);
 const negativeEnabled=!!document.getElementById('adminNegEnabled')?.checked;
 const neg=negativeEnabled?Number(document.getElementById('adminNegative')?.value??0):0;
 const cutoff=Number(document.getElementById('adminCutoff')?.value??0);
 if(!Number.isFinite(marks)||marks<=0||!Number.isFinite(neg)||neg<0||!Number.isFinite(cutoff)||cutoff<0||cutoff>marks*importedPreview.questions.length){alert('Marks, Negative Marking या Cutoff सही करें।');return}
 const btn=document.activeElement;if(btn?.tagName==='BUTTON')btn.disabled=true;
 let newId=null;
 try{
  const {data:isAdmin,error:roleError}=await sb.rpc('examsetu_is_admin'); if(roleError||isAdmin!==true)throw Error('केवल Supabase Admin Exam जोड़ सकता है।');
  const category=folderPath(chosenFolder)||'General';
  // Atomic server-side import: only the authenticated admin can write answer keys.
  const {data:created,error:createError}=await sb.rpc('examsetu_admin_import_exam',{
    p_payload:{title:importedPreview.title,category,description:importedPreview.type||'Full Mock',
      duration:importedPreview.minutes,marks,negative:neg,
      published:!!document.getElementById('adminExamPublished')?.checked,
      questions:importedPreview.questions.map(q=>({text:q.text,text_en:q.text_en,options:q.options,options_en:q.options_en,answer:q.answer,solution:q.solution||'',solution_hi:q.detailed_solution_hi||q.solution||'',solution_en:q.detailed_solution_en||q.solution_en||''}))}
  });
  if(createError)throw createError;
  newId=created?.exam_id||null;
  importedPreview=null;importError='';
  alert('Exam Supabase में Online Save हो गया। अब दूसरे Browser में भी दिखाई दे सकता है।');
  await loadOnlineExams();render();
 }catch(e){
  // The import RPC is transactional; it never leaves a partially saved exam.
  alert('Online Save FAILED: '+(e.message||String(e))+'\nBrowser Demo Storage में Exam Save नहीं किया गया।');
 }finally{if(btn?.tagName==='BUTTON')btn.disabled=false}
}

 if(importedExams.some(y=>y.id!==x.id&&y.folderId===folderId&&y.title.toLowerCase()===title.toLowerCase())){alert('इस Folder में इसी नाम का Exam पहले से है।');return}

 if(!title||!category||!Number.isInteger(duration)||duration<1||!Number.isFinite(marks)||marks<=0||!Number.isFinite(negative)||negative<0||!Number.isFinite(price)||price<0||(paid&&price<=0)||cutoff!==null&&(!Number.isFinite(cutoff)||cutoff<0))return alert('Exam ID '+id+': नाम, Folder, समय, अंक, मूल्य या Cutoff गलत है।');

 changes.push({id,payload,cutoff});
 }
 if(!confirm(changes.length+' परीक्षाओं में बदलाव Save करें? यह Supabase में अलग-अलग अपडेट होंगे।'))return;
 const btn=document.getElementById('es-batch-save');if(btn)btn.disabled=true;
 const ok=[],failed=[];
 for(const c of changes){try{const {data,error}=await sb.from('exams').update(c.payload).eq('id',c.id).select('id');if(error||!data?.length)throw Error(error?.message||'RLS blocked');const old=onlineAdminExamRows.find(e=>Number(e.id)===c.id);if(old&&Number(old.cutoff_marks??-1)!==Number(c.cutoff??-1)){const {error:ce}=await sb.rpc('examsetu_admin_set_cutoff',{p_exam_id:c.id,p_cutoff:c.cutoff});if(ce)throw Error('Exam saved; cutoff failed: '+ce.message)}ok.push(c.id);esBatchDirty.delete(c.id)}catch(err){failed.push(c.id+': '+err.message)}}
 if(btn)btn.disabled=false;
 alert(ok.length+' Exam Save हुए।'+(failed.length?'\nइनमें समस्या आई:\n'+failed.join('\n'):'\nसभी बदलाव पूरे हुए।'));
 if(!failed.length)await loadOnlinePaidAdmin();else{const counter=document.getElementById('es-batch-count');if(counter)counter.textContent=esBatchDirty.size+' परीक्षाओं में बदलाव';}
 await loadOnlineExams();
}

async function saveOnlineExamEditor(id){
 if(!admin||!sb||!currentUser)return alert('Admin Login आवश्यक है।');
 const {data:role,error:roleError}=await sb.rpc('examsetu_is_admin');
 if(roleError||role!==true)return alert('Admin Permission नहीं मिली।');
 const get=k=>document.getElementById(`oe_${k}_${id}`)?.value;
 const title=(get('title')||'').trim(),duration=Number(get('duration')),marks=Number(get('marks')),negative=Number(get('negative'));
 const folderId=get('folder');const track=get('track');const baseCategory=folderId?folderPath(folderId):(get('category')||'').trim();const category=track&&track!=='Other'?track+' / '+baseCategory:baseCategory;
 const is_paid=get('paid')==='paid',price=is_paid?Number(get('price')):0;
 const cutoffRaw=(get('cutoff')||'').trim(),cutoff=cutoffRaw===''?null:Number(cutoffRaw);
 if(!title||!category||!Number.isInteger(duration)||duration<1||!Number.isFinite(marks)||marks<=0||!Number.isFinite(negative)||negative<0||!Number.isFinite(price)||price<0||(is_paid&&price<=0)||cutoff!==null&&(!Number.isFinite(cutoff)||cutoff<0))return alert('Folder, Title, Time, Marks, Price और Cutoff सही भरें।');
 const rawQuestions=(get('questions')||'').trim();
 let questions=null;
 if(rawQuestions){
  try{const parsed=JSON.parse(rawQuestions);questions=Array.isArray(parsed)?parsed:parsed?.questions}
  catch(e){return alert('Questions JSON गलत है: '+e.message)}
  if(!Array.isArray(questions)||!questions.length)return alert('प्रश्न बदलने के लिए कम से कम एक प्रश्न दें, अन्यथा Questions JSON खाली छोड़ें।');
  for(let i=0;i<questions.length;i++){
   const q=questions[i];const opts=q?.options;
   if(!q||typeof q!=='object'||!String(q.text||q.question_text||q.question||'').trim()||!Array.isArray(opts)||opts.length!==4||opts.some(v=>!String(v).trim()))return alert(`Q${i+1}: Question और चारों Options आवश्यक हैं।`);
   const rawAns=q.answer??q.correct??q.correct_answer;const ans=/^[A-Da-d]$/.test(String(rawAns))?String(rawAns).toUpperCase().charCodeAt(0)-65:Number(rawAns);
   if(!Number.isInteger(ans)||ans<0||ans>3)return alert(`Q${i+1}: सही Answer Index 0 से 3 होना चाहिए।`);
   if(!String(q.solution||q.detailed_solution_hi||q.detailed_solution||q.solution_hi||q.explanation||'').trim())return alert(`Q${i+1}: Detailed Solution आवश्यक है।`);
  }
  if(cutoff!==null&&cutoff>marks*questions.length)return alert('Cutoff कुल Marks से अधिक नहीं हो सकता।');
 }
 if(!confirm('सभी Exam बदलाव Online Supabase में Save करें?'))return;
 const payload={title,category,description:get('description')||'',duration,marks,negative,published:get('published')==='true',is_paid,price};
 if(questions!==null)payload.questions=questions;
 const {data,error}=await sb.from('exams').update(payload).eq('id',id).select('id,title,category,description,duration,marks,negative,published,questions,is_paid,price,cutoff_marks');
 if(error)return alert('Save Error: '+error.message);
 if(!data?.length)return alert('Save नहीं हुआ। Admin RLS जाँचें।');
 // Cutoff uses existing protected RPC; do not silently claim success if it fails.
 const {error:cutoffError}=await sb.rpc('examsetu_admin_set_cutoff',{p_exam_id:Number(id),p_cutoff:cutoff});
 if(cutoffError){alert('Exam Save हो गया, लेकिन Cutoff Save नहीं हुआ: '+cutoffError.message);}
 else alert('Exam और Cutoff Supabase में Save हो गए।');
 await loadOnlinePaidAdmin();await loadOnlineExams();
}

 if(is_paid&&(!Number.isFinite(price)||price<=0))return alert('₹ Price 0 से अधिक रखें।');

 await loadOnlineExams();
}

<script id="es-safe-enhancements">
(()=>{
'use strict';
const prefix='examsetu_extra_v1_';
const get=(key,fallback)=>{try{return JSON.parse(localStorage.getItem(prefix+key)||'null')??fallback}catch{return fallback}};
const put=(key,value)=>{try{localStorage.setItem(prefix+key,JSON.stringify(value));return true}catch{return false}};
const safe=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const owner=()=>String(window.currentUser?.id||window.demoAccount?.email||'local');
const questionKey=()=>{
 const isOnline=page==='online-attempt';const a=isOnline?onlineAttempt:null;
 const id=isOnline?(a?.examId||onlineSelectedExam?.id):exam;
 const index=isOnline?(a?.index??0):qi;
 return String(id||'unknown')+':'+index;
};
window.esBookmark=()=>{const key=owner();const list=get('bookmarks_'+key,[]);const q=questionKey();const idx=list.indexOf(q);if(idx>=0)list.splice(idx,1);else list.push(q);if(!put('bookmarks_'+key,list))alert('Storage full: Bookmark सेव नहीं हुआ।');else render()};
window.esReport=()=>{const detail=prompt('इस प्रश्न में क्या समस्या है? गलत उत्तर, गलत विकल्प या समाधान का विवरण लिखें।');if(!detail?.trim())return;const entries=get('reports_'+owner(),[]);entries.push({question:questionKey(),description:detail.trim().slice(0,1000),createdAt:new Date().toISOString(),status:'local-only'});if(put('reports_'+owner(),entries))alert('रिपोर्ट इस डिवाइस में सुरक्षित है। Admin को भेजने के लिए Backend Report API जोड़नी होगी।');else alert('रिपोर्ट सेव नहीं हुई।')};
window.esOpenBookmarks=()=>{const list=get('bookmarks_'+owner(),[]);alert(list.length?'Saved Questions:\n'+list.join('\n'):'अभी कोई Bookmark नहीं है।')};
window.esProgress=()=>{
 const h=Array.isArray(history)?history:[];
 const now=Date.now();
 const parse=r=>{const t=Number(r.id);return t>1e12?t:Date.parse(r.date)||0};
 const stats=days=>{const rows=h.filter(r=>{const t=parse(r);return t>0&&now>=t&&now-t<days*86400000});const scores=rows.map(r=>Number(r.score)).filter(Number.isFinite);return {count:rows.length,avg:scores.length?(scores.reduce((a,b)=>a+b,0)/scores.length).toFixed(1):null}};
 const a=stats(7),b=stats(30);
 document.getElementById('es-progress-modal')?.remove();
 const overlay=document.createElement('div');overlay.id='es-progress-modal';overlay.className='es-progress-overlay';
 overlay.innerHTML=`<section class="es-progress-sheet" role="dialog" aria-modal="true" aria-labelledby="es-progress-title"><div class="es-progress-header"><h2 id="es-progress-title">📊 7 / 30 दिन Progress</h2><button type="button" class="es-progress-close" aria-label="बंद करें">✕</button></div><p class="muted">इस डिवाइस पर उपलब्ध Practice/Demo History</p><div class="es-progress-grid"><article class="es-progress-stat"><h3>पिछले 7 दिन</h3><strong>${a.count}</strong><span>Tests</span><p>औसत Score: ${a.avg??'—'}</p></article><article class="es-progress-stat"><h3>पिछले 30 दिन</h3><strong>${b.count}</strong><span>Tests</span><p>औसत Score: ${b.avg??'—'}</p></article></div><button type="button" class="btn es-progress-done">बंद करें</button></section>`;
 const close=()=>{overlay.remove();document.removeEventListener('keydown',onKey)};
 const onKey=e=>{if(e.key==='Escape')close()};
 overlay.querySelector('.es-progress-close').addEventListener('click',close);
 overlay.querySelector('.es-progress-done').addEventListener('click',close);
 overlay.addEventListener('click',e=>{if(e.target===overlay)close()});
 document.addEventListener('keydown',onKey);document.body.appendChild(overlay);
 overlay.querySelector('.es-progress-close').focus();
};
const baseValidate=window.validateExamJSON;
if(typeof baseValidate==='function')window.validateExamJSON=function(raw){
 const result=baseValidate(raw);const original=Array.isArray(raw)?raw:raw?.questions;
 if(!Array.isArray(original))throw Error('Questions array आवश्यक है');
 const issues=[];
 original.forEach((q,i)=>{
  const opts=q.options;
  if(!Array.isArray(opts)||opts.length!==4||opts.some(v=>typeof v!=='string'||!v.trim()))issues.push(`Q${i+1}: चार गैर-खाली विकल्प आवश्यक हैं`);
  const answer=q.correct??q.answer??q.correct_index;
  if(!Number.isInteger(Number(answer))||Number(answer)<0||Number(answer)>3)issues.push(`Q${i+1}: Answer 0 से 3 होना चाहिए`);
  const marks=q.marks??result.marks_per_question;
  if(!Number.isFinite(Number(marks))||Number(marks)<=0)issues.push(`Q${i+1}: Marks सकारात्मक होने चाहिए`);
  if(!String(q.solution??q.explanation??'').trim())issues.push(`Q${i+1}: Detailed Solution गायब है`);
  if(Array.isArray(q.options_en)&&q.options_en.length>0&&(q.options_en.length!==4||q.options_en.some(x=>!String(x).trim())))issues.push(`Q${i+1}: English options अधूरे हैं`);
 });
 if(issues.length)throw Error('JSON Validation Failed ('+issues.length+' समस्याएँ):\n'+issues.slice(0,12).join('\n')+(issues.length>12?'\n...और '+(issues.length-12)+' समस्याएँ':''));
 return result;
};
// Autosave only demo exam state; never treat browser state as a trusted online score or timer.
let lastBackup='';
const backup=()=>{
 try{
  if(page==='exam'&&mode==='test'&&Array.isArray(data)){
   const state={owner:owner(),exam,seconds:Math.max(0,seconds),qi,answers,review,elapsed,visited,omrVisible,filter,lang,activeExamMinutes,activeNegativeMark,data,savedAt:Date.now(),running:true};
   const serialized=JSON.stringify(state);
   if(serialized!==lastBackup){localStorage.setItem(prefix+'demo_recovery',serialized);lastBackup=serialized}
  }else if(page==='online-attempt'&&onlineAttempt){
   put('online_unsynced_'+owner(),{examId:onlineAttempt.examId,answers:onlineAttempt.answers,index:onlineAttempt.index,review:onlineAttempt.review,visited:onlineAttempt.visited,savedAt:Date.now(),note:'LOCAL BACKUP ONLY - NOT SERVER SUBMISSION'});
  }
 }catch(e){}
};
setInterval(backup,2000);window.addEventListener('pagehide',backup);
const previousFinish=window.finish;
if(typeof previousFinish==='function')window.finish=function(){const result=previousFinish.apply(this,arguments);localStorage.removeItem(prefix+'demo_recovery');return result};
const oldStart=window.startActualExam;
if(typeof oldStart==='function')window.startActualExam=function(){localStorage.removeItem(prefix+'demo_recovery');return oldStart.apply(this,arguments)};
window.esRecover=()=>{
 const state=get('demo_recovery',null);
 if(!state||state.owner!==owner()){alert('इस अकाउंट का कोई Auto-saved Demo Exam नहीं मिला।');return}
 if(!confirm('Auto-saved Demo Exam को Restore करें? Running timer का बीता हुआ समय घटाया जाएगा।'))return;
 if(typeof clearInterval==='function')clearInterval(timer);
 exam=state.exam;data=state.data;qi=state.qi;answers=state.answers;review=state.review;elapsed=state.elapsed;visited=state.visited;omrVisible=state.omrVisible;filter=state.filter;lang=state.lang;activeExamMinutes=state.activeExamMinutes;activeNegativeMark=state.activeNegativeMark;
 seconds=Math.max(0,Number(state.seconds)-Math.ceil((Date.now()-state.savedAt)/1000));mode='test';page='exam';stack=[];render();resumeClock();if(seconds===0)finish();
};
const oldRender=window.render;
if(typeof oldRender==='function')window.render=function(){const ret=oldRender.apply(this,arguments);try{
 const main=document.getElementById('main');if(!main)return ret;
 if(false && (page==='exam'||page==='online-attempt')){
  const root=main.querySelector('.exam-primary .card, .online-test-main .card');
  if(root&&!root.querySelector('.es-tools')){
   const bar=document.createElement('div');bar.className='es-tools';const saved=get('bookmarks_'+owner(),[]).includes(questionKey());
   bar.innerHTML=`<button type="button" onclick="esBookmark()">${saved?'★ Bookmarked':'☆ Bookmark'}</button><button type="button" onclick="esReport()">⚑ Report Question</button>`;root.appendChild(bar);
  }
 }else if(page==='home'||page==='profile'){
  if(!document.getElementById('es-extra-actions')){
   const box=document.createElement('section');box.id='es-extra-actions';box.className='es-extra-panel';box.innerHTML='<h3>📚 Study Tools & Recovery</h3><div class="es-tools"><button onclick="esOpenBookmarks()">Saved Bookmarks</button><button onclick="esProgress()">7 / 30 दिन Progress</button><button onclick="esRecover()">Recover Exam</button></div>';main.appendChild(box);
  }
 }
 }catch(e){console.warn('ExamSetu enhancement UI:',e)}return ret};
const notice=document.createElement('div');notice.className='es-net-status';notice.hidden=navigator.onLine;notice.textContent='⚠ इंटरनेट बंद है — Online Submit/Sync की पुष्टि नहीं हो सकती';document.body.appendChild(notice);
window.addEventListener('online',()=>{notice.hidden=true});window.addEventListener('offline',()=>{backup();notice.hidden=false});
})();
</script>

<script id="es-global-night-toggle-sync">(function(){
 var b=document.getElementById('es-global-night-toggle');if(!b)return;
 function sync(){var d=document.body.classList.contains('dark');b.textContent='☀';b.setAttribute('aria-pressed',d?'true':'false');b.title=d?'Light Mode':'Night Mode';}

 function place(){var header=document.querySelector(".app > header");var name=document.getElementById("es-header-name");var fs=document.fullscreenElement;var target=(fs && (!header || !fs.contains(header)))?fs:header;if(!target)target=document.body;b.classList.toggle("es-fullscreen-night",!!fs&&target===fs);if(b.parentElement!==target){if(target===header&&name)name.insertAdjacentElement("afterend",b);else target.appendChild(b)}else if(target===header&&name&&name.nextElementSibling!==b){name.insertAdjacentElement("afterend",b)}sync()}
 document.addEventListener('fullscreenchange',place);
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',place);else place();
 new MutationObserver(function(){place()}).observe(document.body,{attributes:true,attributeFilter:['class']});
})();</script><script id="es-final-effects-js">
let esProcessingCount=0;
let esProcessingStarted=0;
function esProcessingShow(){
 esProcessingCount++;
 if(esProcessingCount===1)esProcessingStarted=Date.now();
 // Processing overlay intentionally hidden.
}
async function esProcessingHide(){
 if(esProcessingCount<=0)return;
 // Give the logo animation enough time to be seen, even on fast connections.
 const elapsed=Date.now()-esProcessingStarted;
 // No artificial wait for the removed animation.
 esProcessingCount=Math.max(0,esProcessingCount-1);
 if(!esProcessingCount)document.getElementById('es-processing-layer')?.classList.remove('es-visible');
}

<script id="es-global-processing-hooks">
/* Visible loading for user-initiated network operations; background heartbeats and autosaves stay silent. */
(function(){
 const names=['initOnlineAuth','registerDemo','verifySignupOtp','resendSignupOtp','loginDemo','logoutDemo','openAdminOnline','sendPasswordReset','loadOnlineExams','esLoadFinalResult','showOnlineExamQuestions','esOpenSubmittedAnalysis','esOpenSubmittedSolution','onlineStartAttempt','onlinePauseResume','esChangeDisplayName','esFetchRealLeaderboard','esLoadReviewTranslations','esRefreshLiveStats','selectExamFile','importExamNow','replaceExamQuestions','loadOnlinePaidAdmin','saveOnlineExamEditor','saveOnlinePaidExam','loadAdminOnlineExams','deleteOnlineExam','setOnlineExamPublished','saveOnlineExamCutoff'];
 function wrap(name){
  try{
   const original=window[name];
   if(typeof original!=='function'||original.__esLoadingWrapped)return;
   const wrapped=async function(...args){
    esProcessingShow();
    try{return await original.apply(this,args)}
    finally{await esProcessingHide()}
   };
   wrapped.__esLoadingWrapped=true;
   window[name]=wrapped;
  }catch(e){console.warn('Processing wrapper:',name,e)}
 }
 names.forEach(wrap);
})();
</script>

  function updateDailyBanner(){
    const parts=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Kolkata',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
    const part=(type)=>Number(parts.find(p=>p.type===type).value);
    const today=Math.floor(Date.UTC(part('year'),part('month')-1,part('day'))/86400000);
    const first=Math.floor(Date.UTC(2026,9,17)/86400000);
    const day=((today-first)%30+30)%30;
    // Day 1 retains the original ExamSetu student-on-summit illustration.
    if(day===0) document.documentElement.style.setProperty('--es-daily-banner-image','url("'+original+'")');
    else document.documentElement.style.setProperty('--es-daily-banner-image','url("'+images[day-1]+'")');
    document.documentElement.dataset.examsetuBannerDay=String(day+1);
  }
  updateDailyBanner();
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)updateDailyBanner();});
  window.setInterval(updateDailyBanner,60000);
})();

<script id="es-android-premium-bootstrap">
(function(){
 const ua=navigator.userAgent||'';
 // Native app detection is independent of viewport width.
 const android=/Android/i.test(ua);
 const bridge=typeof window.ExamSetuAndroid!=='undefined' && window.ExamSetuAndroid!==null;
 const appUA=/ExamSetuApp/i.test(ua);
 const webviewUA=android && (/(?:;\s*wv\)|\bwv\b)/i.test(ua));
 const isApp=bridge || (android && (appUA || webviewUA));
 const isMobileWeb=!isApp && window.matchMedia && window.matchMedia('(max-width: 700px)').matches;
 document.documentElement.classList.toggle('es-android-app',Boolean(isApp));
 document.documentElement.classList.toggle('es-mobile-web',Boolean(isMobileWeb));
 if(!isApp)return;
 document.addEventListener('DOMContentLoaded',()=>{
  // Native WebView splash overlay disabled; render the app immediately.
  const obs=new MutationObserver(()=>{
   const active=document.querySelector('.es-premium-number-list .es-sol-current');
   if(active)window.__esPremiumLastActive=active;
  });obs.observe(document.body,{childList:true,subtree:true});
 });
})();
</script>

<script id="es-all-screens-premium-nav">
(function(){
if(!document.documentElement.matches('.es-android-app, .es-mobile-web'))return;
const icons={home:'<path d="m3 10 9-7 9 7v10h-6v-6H9v6H3z"/>',exams:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 3h6M9 10h6M9 14h6"/>',results:'<path d="M4 20V10m6 10V5m6 15v-8m5 8H3"/>',profile:'<circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/>'};
const items=[['home','Home','home'],['tests','Exams','exams'],['my-results','Results','results'],['profile','Profile','profile']];
function update(){
 const pg=typeof page!=='undefined'?page:'';
 const hide=['login','signup','forgot','admin-login','exam','online-attempt'].includes(pg)||document.body.classList.contains('admin-mode')||document.body.classList.contains('auth-screen')||document.body.classList.contains('exam-screen')||document.body.classList.contains('online-exam-screen');
 let bar=document.getElementById('es-bottom-tabs');
 if(hide||!document.body.classList.contains('home-nav-visible')){if(bar)bar.remove();return;}
 if(!bar){bar=document.createElement('div');bar.id='es-bottom-tabs';bar.className='es-bottom-tabs';document.body.appendChild(bar);}
 const active=pg==='home'?'home':(['tests','online-exams','series-detail'].includes(pg)?'tests':(['my-results','online-result','results','history'].includes(pg)?'my-results':'profile'));
 const html=items.map(([target,label,ic])=>'<button type="button" data-target="'+target+'" class="'+(active===target?'active':'')+'" aria-label="'+label+'"><svg viewBox="0 0 24 24">'+icons[ic]+'</svg><span>'+label+'</span></button>').join('');
 if(bar.dataset.rendered!==html){bar.innerHTML=html;bar.dataset.rendered=html;}
}
 document.addEventListener('click',e=>{const b=e.target.closest('#es-bottom-tabs button[data-target]');if(!b)return;const target=b.dataset.target;if(target==='my-results'){if(typeof esRefreshMyResults==='function')esRefreshMyResults();return;}if(typeof go==='function')go(target);});
 document.addEventListener('DOMContentLoaded',()=>{update();const main=document.getElementById('main');if(main){new MutationObserver(()=>queueMicrotask(update)).observe(main,{childList:true});}});
})();
</script>
<script id="es-v15-compact-exam-js">
(function(){
 const mobile=()=>window.matchMedia('(max-width:700px)').matches;
 let busy=false;
 function update(){
  if(busy||!mobile()||!document.body.classList.contains('online-exam-screen'))return;
  const root=document.querySelector('.online-test-shell, .exam-shell');
  if(!root)return;
  busy=true;
  try{
   let bar=document.querySelector('.es-v15-top');
   if(!bar){bar=document.createElement('div');bar.className='es-v15-top';root.parentNode.insertBefore(bar,root);}
   const online=root.classList.contains('online-test-shell');
   const source=document.querySelector(online?'.online-test-top':'.exam-title-bar');
   const title=source?.querySelector('b')?.textContent?.trim()||document.title.replace('ExamSetu','').trim()||'ExamSetu Test';
   const originalClock=document.querySelector(online?'#online-clock':'#exam-top-clock');
   const clock=originalClock?.textContent||'--:--';
   const question=(online?document.querySelector('.es-screen-question-status b'):document.querySelector('.exam-count .chip'))?.textContent||'प्रश्न';
   const mark=online?(document.querySelector('.es-mark-circle')?.textContent||'3'):'3';
   if(bar.dataset.kind!==String(online)){
    bar.innerHTML='<div class="es-v15-blue"><button class="es-v15-back" type="button" aria-label="Back" onclick="return false">‹</button><span class="es-v15-title"></span><button class="es-v15-icon" type="button" onclick="toggleDark()" aria-label="Night mode">☀</button><button class="es-v15-icon" type="button" id="es-v15-langicon" aria-label="Language">🌐</button></div><div class="es-v15-row"><button type="button" class="es-v15-clock" onclick="onlinePauseResume()" title="Pause exam and exit">⏱ <span class="es-v15-time"></span> ⏸</button><button type="button" class="es-v15-icon" title="Mark for review" id="es-v15-review">☆</button><button type="button" class="es-v15-omr" id="es-v15-omr">▦ OMR</button><select class="es-v15-lang" aria-label="Language" id="es-v15-select"><option value="hi">हिन्दी</option><option value="en">English</option></select></div><div class="es-v15-meta"><span class="es-v15-counter"></span><span class="es-v15-mark"></span></div>';
    bar.dataset.kind=String(online);
    bar.querySelector('#es-v15-omr').onclick=()=>{if(online){if(typeof onlineToggleOMR==='function')onlineToggleOMR();}else{const old=document.querySelector('.omr-toggle, [onclick*="omrVisible"], [onclick*="toggleOmr"]');if(old)old.click();}};
    bar.querySelector('#es-v15-review').onclick=()=>{if(online&&typeof onlineToggleReview==='function')onlineToggleReview();else{const old=document.querySelector('[onclick*="markReview"], [onclick*="toggleReview"]');if(old)old.click();}};
    bar.querySelector('#es-v15-select').onchange=e=>{if(online&&typeof onlineSetLanguage==='function')onlineSetLanguage(e.target.value);else{const old=document.querySelector('.exam-language-select');if(old){old.value=e.target.value;old.dispatchEvent(new Event('change',{bubbles:true}));}}};
    bar.querySelector('#es-v15-langicon').onclick=()=>bar.querySelector('#es-v15-select').focus();
   }
   if(bar.querySelector('.es-v15-title').textContent!==title)bar.querySelector('.es-v15-title').textContent=title;
   if(bar.querySelector('.es-v15-time').textContent!==clock)bar.querySelector('.es-v15-time').textContent=clock;
   const countText=question.replace('Question No.','प्रश्न ').replace('Question ','प्रश्न ');if(bar.querySelector('.es-v15-counter').textContent!==countText)bar.querySelector('.es-v15-counter').textContent=countText;
   if(bar.querySelector('.es-v15-mark').textContent!=='+'+mark+' अंक')bar.querySelector('.es-v15-mark').textContent='+'+mark+' अंक';
   const originalSelect=document.querySelector(online?'.es-status-language select':'.exam-language-select');
   if(originalSelect)bar.querySelector('#es-v15-select').value=originalSelect.value;
  }finally{busy=false;}
 }
 const observer=new MutationObserver(()=>{if(!busy)requestAnimationFrame(update)});
 observer.observe(document.body,{subtree:true,childList:true});
 setInterval(()=>{const src=document.querySelector('#online-clock, #exam-top-clock');const dst=document.querySelector('.es-v15-time');if(src&&dst)dst.textContent=src.textContent;},1000);
 document.addEventListener('DOMContentLoaded',update);
 update();
})();
</script>
